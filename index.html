<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="ميزانية البيت"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1D6FA4"/>
<title>ميزانية البيت</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ═══════════════════════════════
   TOKENS
═══════════════════════════════ */
:root {
  --bg:       #F7F8FA;
  --surface:  #FFFFFF;
  --surface2: #F0F2F5;
  --border:   #E8ECF2;
  --text:     #111827;
  --text2:    #6B7280;
  --text3:    #9CA3AF;
  --income:   #0EA370;
  --income-bg:#E6F7F1;
  --expense:  #E5484D;
  --expense-bg:#FDEAEB;
  --accent:   #1D6FA4;
  --accent-bg:#E8F2FA;
  --amber:    #D97706;
  --amber-bg: #FEF3C7;
  --shadow:   0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --r:        14px;
  --r-sm:     10px;

  /* Theme pink override */
  --theme-accent: #1D6FA4;
  --theme-hdr1:   #1D6FA4;
  --theme-hdr2:   #1558A0;
}
body.pink {
  --theme-accent: #C2185B;
  --theme-hdr1:   #E75480;
  --theme-hdr2:   #C2185B;
  --accent:       #C2185B;
  --accent-bg:    #FCE4EC;
}

/* ═══════════════════════════════
   RESET & BASE
═══════════════════════════════ */
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); }
body { font-family:'Cairo',-apple-system,BlinkMacSystemFont,sans-serif; max-width:430px; margin:0 auto; color:var(--text); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
button, input, select { font-family:inherit; }
button { cursor:pointer; border:none; background:none; }
::-webkit-scrollbar { width:0; height:0; }
input { -webkit-appearance:none; }
input[type="date"] { -webkit-appearance:none; }

/* ═══════════════════════════════
   LAYOUT
═══════════════════════════════ */
.page { min-height:100vh; padding-bottom:80px; }
.content { padding:16px; display:flex; flex-direction:column; gap:12px; }

/* ═══════════════════════════════
   CARDS
═══════════════════════════════ */
.card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.card-p { padding:16px 18px; }

/* ═══════════════════════════════
   HEADER
═══════════════════════════════ */
.hdr {
  background:linear-gradient(145deg, var(--theme-hdr1) 0%, var(--theme-hdr2) 100%);
  padding:52px 18px 20px;
  position:relative;
}
.hdr-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:rgba(255,255,255,.65); margin-bottom:4px; }

/* ═══════════════════════════════
   BALANCE CARD (signature element)
   — split scale: income left / expense right
═══════════════════════════════ */
.balance-card {
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  padding:18px;
  margin-bottom:14px;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.balance-main {
  display:flex;
  justify-content:center;
  align-items:baseline;
  gap:6px;
  margin-bottom:4px;
}
.balance-num { font-size:36px; font-weight:900; color:#fff; letter-spacing:-1px; }
.balance-cur { font-size:13px; font-weight:600; color:rgba(255,255,255,.6); }
.balance-label { font-size:11px; color:rgba(255,255,255,.55); font-weight:600; letter-spacing:.5px; text-align:center; margin-bottom:14px; }
.balance-scale {
  display:grid;
  grid-template-columns:1fr 4px 1fr;
  gap:0;
  align-items:center;
}
.scale-side { display:flex; flex-direction:column; gap:2px; }
.scale-side.right { text-align:right; }
.scale-side.left  { text-align:left; }
.scale-lbl { font-size:10px; color:rgba(255,255,255,.55); font-weight:700; }
.scale-val { font-size:16px; font-weight:900; }
.scale-val.inc { color:#6EE7B7; }
.scale-val.exp { color:#FCA5A5; }
.scale-divider { width:1px; height:36px; background:rgba(255,255,255,.2); margin:0 auto; }
.scale-bar-wrap { margin-top:10px; position:relative; height:4px; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden; }
.scale-bar-fill { position:absolute; top:0; right:0; height:100%; border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }

/* ═══════════════════════════════
   MONTH SCROLLER
═══════════════════════════════ */
.month-scroll { display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
.month-scroll::-webkit-scrollbar { height:0; }
.mtab {
  flex-shrink:0; padding:6px 14px; border-radius:20px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.1);
  color:rgba(255,255,255,.75); font-size:12px; font-weight:700;
  cursor:pointer; font-family:inherit; transition:all .15s;
}
.mtab.active { background:rgba(255,255,255,.9); color:var(--theme-hdr2); border-color:transparent; }

/* ═══════════════════════════════
   QUICK ADD BAR
═══════════════════════════════ */
.quick-bar {
  display:grid; grid-template-columns:1fr 1fr;
  gap:10px;
}
.quick-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  padding:13px; border-radius:var(--r); font-size:14px; font-weight:800;
  border:none; cursor:pointer; font-family:inherit; transition:opacity .15s;
}
.quick-btn:active { opacity:.8; }
.quick-inc { background:var(--income-bg); color:var(--income); }
.quick-exp { background:var(--expense-bg); color:var(--expense); }

/* ═══════════════════════════════
   STATS ROW
═══════════════════════════════ */
.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
.stat-card { background:var(--surface); border-radius:var(--r-sm); box-shadow:var(--shadow); padding:12px; text-align:center; }
.stat-lbl { font-size:10px; color:var(--text2); font-weight:700; margin-bottom:4px; }
.stat-val { font-size:17px; font-weight:900; }
.stat-cur { font-size:10px; color:var(--text3); }

/* ═══════════════════════════════
   SECTION TITLE
═══════════════════════════════ */
.sec-title { font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--text3); margin-bottom:8px; }

/* ═══════════════════════════════
   PROGRESS BAR
═══════════════════════════════ */
.prog { background:var(--surface2); border-radius:99px; height:5px; overflow:hidden; margin-top:7px; }
.prog-fill { height:100%; border-radius:99px; transition:width .5s cubic-bezier(.4,0,.2,1); }

/* ═══════════════════════════════
   TRANSACTION ROW
═══════════════════════════════ */
.tx-row {
  display:flex; align-items:center; gap:12px;
  padding:12px 16px;
}
.tx-row + .tx-row { border-top:1px solid var(--border); }
.tx-icon { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.tx-info { flex:1; min-width:0; }
.tx-name { font-size:13px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-sub  { font-size:11px; color:var(--text3); margin-top:1px; }
.tx-amt  { font-size:15px; font-weight:900; flex-shrink:0; }

/* ═══════════════════════════════
   CATEGORY CHIPS
═══════════════════════════════ */
.cat-grid { display:flex; flex-wrap:wrap; gap:7px; }
.cat-chip {
  display:flex; align-items:center; gap:6px;
  padding:8px 12px; border-radius:22px;
  border:1.5px solid var(--border);
  background:var(--surface2);
  font-size:12px; font-weight:700; color:var(--text2);
  cursor:pointer; transition:all .15s; font-family:inherit;
}
.cat-chip.active { border-color:currentColor; }

/* ═══════════════════════════════
   INPUTS
═══════════════════════════════ */
.inp {
  width:100%; background:var(--surface2); border:1.5px solid var(--border);
  border-radius:var(--r-sm); padding:12px 14px; font-size:15px;
  color:var(--text); outline:none; font-family:inherit; display:block;
  transition:border-color .2s, background .2s;
}
.inp:focus { border-color:var(--theme-accent); background:var(--surface); }
.inp-big { font-size:28px; font-weight:900; text-align:center; padding:14px; }
select.inp { cursor:pointer; }

/* ═══════════════════════════════
   BUTTONS
═══════════════════════════════ */
.btn { width:100%; border:none; border-radius:var(--r); padding:14px; font-size:15px; font-weight:800; color:#fff; display:block; text-align:center; font-family:inherit; cursor:pointer; transition:opacity .15s; }
.btn:active { opacity:.85; }
.btn-ghost { background:var(--surface2) !important; color:var(--text) !important; border:1.5px solid var(--border); }
.btn-danger { background:var(--expense-bg) !important; color:var(--expense) !important; border:none; }
.btn-income  { background:var(--income) !important; }
.btn-expense { background:var(--expense) !important; }
.btn-accent  { background:var(--theme-accent) !important; }

/* ═══════════════════════════════
   CHART (pure CSS donut)
═══════════════════════════════ */
.chart-wrap { display:flex; align-items:center; gap:16px; padding:16px 18px; }
.donut-wrap { position:relative; width:110px; height:110px; flex-shrink:0; }
.donut-wrap svg { transform:rotate(-90deg); }
.donut-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-center-val { font-size:16px; font-weight:900; color:var(--text); }
.donut-center-lbl { font-size:9px; color:var(--text3); font-weight:700; }
.chart-legend { flex:1; display:flex; flex-direction:column; gap:7px; }
.legend-row { display:flex; align-items:center; gap:8px; }
.legend-dot { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.legend-lbl { flex:1; font-size:12px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend-val { font-size:12px; font-weight:800; color:var(--text2); }

/* ═══════════════════════════════
   TAB BAR
═══════════════════════════════ */
.tabbar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background:var(--surface); border-top:1px solid var(--border);
  display:grid; grid-template-columns:repeat(5,1fr);
  z-index:100; box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
.tab-btn {
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 0 12px; background:none; border:none; cursor:pointer;
  color:var(--text3); transition:color .15s; font-family:inherit;
}
.tab-btn.active { color:var(--theme-accent); }
.tab-icon { font-size:20px; line-height:1; }
.tab-lbl  { font-size:10px; font-weight:700; }

/* ═══════════════════════════════
   BACK BUTTON
═══════════════════════════════ */
.back-btn {
  width:40px; height:40px; border-radius:12px; flex-shrink:0;
  background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.3);
  color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
}
.back-btn-light {
  background:var(--surface2); border:1.5px solid var(--border);
  color:var(--text);
}

/* ═══════════════════════════════
   BADGE / PILL
═══════════════════════════════ */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }

/* ═══════════════════════════════
   TOAST
═══════════════════════════════ */
.toast {
  position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-10px);
  background:var(--text); color:#fff; border-radius:12px; padding:10px 20px;
  z-index:500; font-size:13px; font-weight:700; white-space:nowrap;
  opacity:0; pointer-events:none; transition:all .25s;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ═══════════════════════════════
   MODAL OVERLAY
═══════════════════════════════ */
.overlay {
  position:fixed; inset:0; background:rgba(17,24,39,.5);
  z-index:300; display:none; align-items:flex-end;
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
}
.overlay.show { display:flex; }
.sheet {
  background:var(--surface); width:100%; border-radius:22px 22px 0 0;
  padding:28px 20px; border-top:1px solid var(--border);
  box-shadow:0 -8px 40px rgba(0,0,0,.12);
}
.sheet-handle { width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 20px; }

/* ═══════════════════════════════
   DIVIDER
═══════════════════════════════ */
.divider { height:1px; background:var(--border); margin:0; }

/* ═══════════════════════════════
   EMPTY STATE
═══════════════════════════════ */
.empty { text-align:center; padding:60px 24px; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-title { font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
.empty-body  { font-size:13px; color:var(--text3); line-height:1.7; }

/* ═══════════════════════════════
   TABLE
═══════════════════════════════ */
.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { padding:9px 12px; background:var(--surface2); color:var(--text2); font-weight:800; text-align:right; border-bottom:1px solid var(--border); font-size:11px; letter-spacing:.5px; }
td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text); text-align:right; }
tr:last-child td { border-bottom:none; }
.td-inc { color:var(--income); font-weight:800; }
.td-exp { color:var(--expense); font-weight:800; }
.td-bal { font-weight:900; }

/* ═══════════════════════════════
   ONBOARD
═══════════════════════════════ */
.onboard { min-height:100vh; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
.ob-emoji { font-size:72px; margin-bottom:24px; }
.ob-title { font-size:24px; font-weight:900; color:var(--text); margin-bottom:10px; line-height:1.3; }
.ob-body  { font-size:15px; color:var(--text3); line-height:1.8; margin-bottom:36px; }
.ob-dots  { display:flex; justify-content:center; gap:8px; margin-bottom:36px; }
.ob-dot   { height:7px; border-radius:99px; background:var(--border); transition:all .3s; }
.ob-dot.active { background:var(--theme-accent); width:24px; }
.ob-dot:not(.active) { width:7px; }

/* ═══════════════════════════════
   REPORT CHART BAR
═══════════════════════════════ */
.bar-chart { display:flex; flex-direction:column; gap:10px; }
.bar-row { display:flex; align-items:center; gap:10px; }
.bar-row-lbl { width:80px; font-size:12px; font-weight:700; color:var(--text2); text-align:right; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { flex:1; background:var(--surface2); border-radius:99px; height:8px; overflow:hidden; }
.bar-fill  { height:100%; border-radius:99px; transition:width .5s; }
.bar-val   { font-size:12px; font-weight:800; color:var(--text); flex-shrink:0; width:70px; text-align:left; }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="modal-overlay">
  <div class="sheet" id="modal-sheet">
    <div class="sheet-handle"></div>
    <div id="modal-title" style="font-size:17px;font-weight:900;margin-bottom:6px;color:var(--text)"></div>
    <div id="modal-body"  style="font-size:13px;color:var(--text2);margin-bottom:16px"></div>
    <div id="modal-warn" style="display:none;font-size:12px;color:var(--expense);margin-bottom:12px">⚠️ سيتم حذف كل ما بداخله</div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-danger" id="modal-confirm">حذف</button>
      <button class="btn btn-ghost"  id="modal-cancel">إلغاء</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════════
var CUR = "د.ب";
var MN  = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var MNS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

// Default category seeds (used only on first run)
var DEFAULT_EXP_CATS = [
  {id:"groceries",   lbl:"بقالة",         em:"🛒", c:"#0EA370"},
  {id:"food",        lbl:"طعام",          em:"🍽️", c:"#F97316"},
  {id:"debt",        lbl:"ديون",          em:"💳", c:"#E5484D"},
  {id:"children",    lbl:"أطفال",         em:"👶", c:"#EC4899"},
  {id:"car",         lbl:"سيارة",         em:"🚗", c:"#6366F1"},
  {id:"fuel",        lbl:"وقود",          em:"⛽", c:"#8B5CF6"},
  {id:"health",      lbl:"صحة",           em:"🏥", c:"#14B8A6"},
  {id:"home",        lbl:"بيت",           em:"🏠", c:"#3B82F6"},
  {id:"electricity", lbl:"كهرباء",        em:"💡", c:"#EAB308"},
  {id:"mobile",      lbl:"موبايل",        em:"📱", c:"#06B6D4"},
  {id:"shopping",    lbl:"مشتريات",       em:"🛍️", c:"#A855F7"},
  {id:"entertain",   lbl:"ترفيه",         em:"🎮", c:"#F43F5E"},
  {id:"travel",      lbl:"سفر",           em:"✈️", c:"#0EA5E9"},
  {id:"other",       lbl:"أخرى",          em:"📦", c:"#9CA3AF"},
];
var DEFAULT_INC_CATS = [
  {id:"salary",  lbl:"الراتب",    em:"💰", c:"#0EA370"},
  {id:"income2", lbl:"دخل ثانوي",em:"💼", c:"#3B82F6"},
  {id:"shop",    lbl:"المتجر",   em:"🏪", c:"#D97706"},
  {id:"other",   lbl:"أخرى",     em:"📥", c:"#8B5CF6"},
];
// Will be loaded from localStorage
var EXP_CATS = [];
var INC_CATS = [];

// ════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════
function ld(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var S = {
  txs:      ld("mb_tx",[]),
  onboarded:ld("mb_on",false),
  theme:    ld("mb_th","blue"),
  expCats:  ld("mb_ec",null),
  incCats:  ld("mb_ic",null),
};
// Init cats: load from storage or use defaults
EXP_CATS = S.expCats ? S.expCats : DEFAULT_EXP_CATS.slice();
INC_CATS = S.incCats ? S.incCats : DEFAULT_INC_CATS.slice();
if(!S.expCats){S.expCats=EXP_CATS;}
if(!S.incCats){S.incCats=INC_CATS;}

function save(){
  sv("mb_tx",S.txs);
  sv("mb_on",S.onboarded);
  sv("mb_th",S.theme);
  sv("mb_ec",S.expCats);
  sv("mb_ic",S.incCats);
}

// ════════════════════════════════════════════
//  UI STATE
// ════════════════════════════════════════════
var UI = {
  view:    S.onboarded ? "home" : "onboard",
  tab:     "home",
  month:   new Date().toISOString().slice(0,7),
  obStep:  0,
  editTx:  null,
  editCat: null,
  editCatType: "expense",
  pivotData: null,
  modalCb: null,
};

// ════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════
function uid(){return "_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);}
function fmt(n){return Number(n||0).toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function today(){return new Date().toISOString().slice(0,10);}
function cleanN(v){return parseFloat(String(v||0).replace(/,/g,"").replace(/[^0-9.]/g,""))||0;}
function monthLbl(ym){var p=ym.split("-");return MN[parseInt(p[1])-1]+" "+p[0];}
function getCat(type,id){
  var arr=type==="income"?INC_CATS:EXP_CATS;
  for(var i=0;i<arr.length;i++){if(arr[i].id===id)return arr[i];}
  return {id:"other",lbl:type==="income"?"أخرى":"أخرى",em:"📦",c:"#9CA3AF"};
}
function dataMonths(){
  var m={};
  for(var i=0;i<S.txs.length;i++) m[S.txs[i].date.slice(0,7)]=1;
  var arr=Object.keys(m).sort().reverse();
  if(!arr.length) arr=[new Date().toISOString().slice(0,7)];

}
function monthStats(ym){
  var inc=0,exp=0,byEC={},byIC={};
  for(var i=0;i<EXP_CATS.length;i++) byEC[EXP_CATS[i].id]=0;
  for(var i=0;i<INC_CATS.length;i++) byIC[INC_CATS[i].id]=0;
  var txs=[];
  for(var i=0;i<S.txs.length;i++){
    var t=S.txs[i];
    if(t.date.slice(0,7)!==ym) continue;
    txs.push(t);
    if(t.type==="income"){inc+=t.amount;byIC[t.catId]=(byIC[t.catId]||0)+t.amount;}
    else {exp+=t.amount;byEC[t.catId]=(byEC[t.catId]||0)+t.amount;}
  }
  return{inc:inc,exp:exp,bal:inc-exp,txs:txs,byEC:byEC,byIC:byIC};
}

function el(tag,props,kids){
  var e=document.createElement(tag);
  if(props) {
    var keys=Object.keys(props);
    for(var i=0;i<keys.length;i++){
      var k=keys[i], v=props[k];
      if(k==="cls") e.className=v;
      else if(k==="sty"&&typeof v==="object"){var sk=Object.keys(v);for(var j=0;j<sk.length;j++)e.style[sk[j]]=v[sk[j]];}
      else if(k.slice(0,2)==="on"&&typeof v==="function") e.addEventListener(k.slice(2),v);
      else e.setAttribute(k,v);
    }
  }
  if(kids!=null){
    var arr=Array.isArray(kids)?kids:[kids];
    for(var i=0;i<arr.length;i++){
      var c=arr[i];
      if(c==null) continue;
      e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);
    }
  }
  return e;
}

// Donut chart
function donutChart(data, total, centerVal, centerLbl){
  var size=110, r=44, cx=55, cy=55, sw=14;
  var circ=2*Math.PI*r;
  var svgNS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("width",size); svg.setAttribute("height",size);
  svg.setAttribute("viewBox","0 0 "+size+" "+size);
  svg.style.transform="rotate(-90deg)";
  // background circle
  var bg=document.createElementNS(svgNS,"circle");
  bg.setAttribute("cx",cx); bg.setAttribute("cy",cy); bg.setAttribute("r",r);
  bg.setAttribute("fill","none"); bg.setAttribute("stroke","#F0F2F5");
  bg.setAttribute("stroke-width",sw); svg.appendChild(bg);
  var offset=0;
  for(var i=0;i<data.length;i++){
    var d=data[i];
    if(!d.v) continue;
    var pct=d.v/total;
    var dash=pct*circ;
    var c=document.createElementNS(svgNS,"circle");
    c.setAttribute("cx",cx); c.setAttribute("cy",cy); c.setAttribute("r",r);
    c.setAttribute("fill","none"); c.setAttribute("stroke",d.color);
    c.setAttribute("stroke-width",sw);
    c.setAttribute("stroke-dasharray",dash+" "+(circ-dash));
    c.setAttribute("stroke-dashoffset",-offset);
    c.setAttribute("stroke-linecap","butt");
    svg.appendChild(c);
    offset+=dash;
  }
  var wrap=el("div",{cls:"donut-wrap"});
  wrap.appendChild(svg);
  var center=el("div",{cls:"donut-center"});
  center.appendChild(el("div",{cls:"donut-center-val"},centerVal));
  center.appendChild(el("div",{cls:"donut-center-lbl"},centerLbl));
  wrap.appendChild(center);
  return wrap;
}

// ════════════════════════════════════════════
//  EXCEL IMPORT
// ════════════════════════════════════════════
var MNS_EN=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
var MNS_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function isMonthH(h){var l=String(h||"").toLowerCase().trim();for(var i=0;i<MNS_EN.length;i++){if(l.startsWith(MNS_EN[i]))return true;}for(var i=0;i<MNS_AR.length;i++){if(l.includes(MNS_AR[i]))return true;}return false;}
function monthIdx(h){var l=String(h||"").toLowerCase().trim();for(var i=0;i<MNS_EN.length;i++){if(l.startsWith(MNS_EN[i]))return i+1;}for(var i=0;i<MNS_AR.length;i++){if(l.includes(MNS_AR[i]))return i+1;}return -1;}

function handleXL(e){
  var file=e.target.files[0];if(!file)return;
  if(typeof XLSX==="undefined"){toast("يتطلب اتصال إنترنت");return;}
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
      var bestRaw=null,bestHIdx=-1;
      for(var si=0;si<wb.SheetNames.length;si++){
        var sh=wb.Sheets[wb.SheetNames[si]];
        if(!sh||!sh["!ref"])continue;
        var raw=XLSX.utils.sheet_to_json(sh,{header:1,defval:""});
        for(var ri=0;ri<raw.length;ri++){
          var cnt=0;for(var ci=0;ci<raw[ri].length;ci++)if(isMonthH(raw[ri][ci]))cnt++;
          if(cnt>=2){if(!bestRaw){bestRaw=raw;bestHIdx=ri;}break;}
        }
        if(bestRaw)break;
      }
      if(!bestRaw||bestHIdx<0){toast("لم يُعثر على بيانات بتنسيق شهري");return;}
      UI.pivotData=parsePivot(bestRaw,bestHIdx);
      go("confirmXL");
    }catch(err){toast("خطأ: "+err.message);}
  };
  r.readAsArrayBuffer(file);
}

function parsePivot(raw,hIdx){
  var hRow=raw[hIdx];
  var mCols=[];
  for(var ci=0;ci<hRow.length;ci++){if(isMonthH(hRow[ci]))mCols.push({ci:ci,mi:monthIdx(hRow[ci]),h:String(hRow[ci]).trim()});}
  // Find label column: first non-month, non-empty header
  var labelCol=0;
  for(var ci=0;ci<hRow.length;ci++){var hv=String(hRow[ci]||"").trim().toLowerCase();if(hv&&!isMonthH(hv)&&hv!=="bhd"&&hv!=="kwd"&&hv!=="د.ب"){labelCol=ci;break;}}

  var incRows=[],expRows=[],section="",curLabel="";
  var skipWords=["TOTAL","BALANCE","SUMMARY","ANNUAL","AVERAGE","PERCENTAGE","المجموع","الميزانية","BHD -","KWD"];

  for(var ri=hIdx+1;ri<raw.length;ri++){
    var row=raw[ri];

    // Get first non-empty cell to detect section headers
    var firstVal="";
    for(var ci=0;ci<row.length;ci++){var cv=String(row[ci]||"").trim();if(cv){firstVal=cv.toUpperCase();break;}}
    if(!firstVal)continue;

    // Section detection
    if(firstVal.includes("INCOME")||firstVal.includes("دخل")){section="income";curLabel="";continue;}
    if(firstVal.includes("EXPENSE")||firstVal.includes("مصروف")){section="expense";curLabel="";continue;}

    // Skip summary rows
    var skip=false;
    for(var si=0;si<skipWords.length;si++)if(firstVal.startsWith(skipWords[si])){skip=true;break;}
    if(skip)continue;
    if(!section)continue;

    // Get label: prefer labelCol, but accept any non-BHD non-empty text cell
    var lbl=String(row[labelCol]||"").trim();
    // Skip if label is just "BHD", "-", currency symbol, or empty
    var lblUp=lbl.toUpperCase();
    if(lblUp==="BHD"||lblUp==="KWD"||lblUp==="-"||lblUp==="د.ب"||lbl.length<2){
      // Try to find label in other columns
      lbl="";
      for(var ci=0;ci<mCols[0].ci;ci++){
        var cv2=String(row[ci]||"").trim();
        var cv2up=cv2.toUpperCase();
        if(cv2&&cv2up!=="BHD"&&cv2up!=="KWD"&&cv2up!=="-"&&cv2up!=="د.ب"&&cv2.length>=2){lbl=cv2;break;}
      }
    }

    // If still no label, use last known label for this section (continuation row)
    if(!lbl&&curLabel) lbl=curLabel;
    if(!lbl) continue;
    curLabel=lbl; // remember for next rows in same section

    // Read values for each month column
    for(var ci=0;ci<mCols.length;ci++){
      var mc=mCols[ci];
      var cellVal=String(row[mc.ci]||"").trim();
      // Strip BHD prefix and commas
      cellVal=cellVal.replace(/BHD/gi,"").replace(/KWD/gi,"").replace(/د\.ب/g,"").replace(/,/g,"").trim();
      var val=parseFloat(cellVal.replace(/[^0-9.]/g,""))||0;
      if(val<=0)continue;
      var tx={label:lbl,amount:val,month:mc.mi};
      if(section==="income")incRows.push(tx);
      else expRows.push(tx);
    }
  }
  return{incRows:incRows,expRows:expRows,year:new Date().getFullYear()};
}

function pageConfirmXL(){
  var pd=UI.pivotData;if(!pd){go("more");return el("div");}
  var iT=0,eT=0;for(var i=0;i<pd.incRows.length;i++)iT+=pd.incRows[i].amount;for(var i=0;i<pd.expRows.length;i++)eT+=pd.expRows[i].amount;
  var expByCat={};for(var i=0;i<pd.expRows.length;i++){var l=pd.expRows[i].label;expByCat[l]=(expByCat[l]||0)+pd.expRows[i].amount;}
  var incByCat={};for(var i=0;i<pd.incRows.length;i++){var l=pd.incRows[i].label;incByCat[l]=(incByCat[l]||0)+pd.incRows[i].amount;}

  var page=el("div",{sty:{minHeight:"100vh",paddingBottom:"80px",background:"var(--bg)",overflowY:"auto"}});
  var hdr=el("div",{cls:"hdr"});
  hdr.appendChild(el("div",{sty:{display:"flex",alignItems:"center",gap:"14px",marginBottom:"14px"}},[
    el("button",{cls:"back-btn",onclick:function(){go("more");}},["←"]),
    el("div",{sty:{fontSize:"19px",fontWeight:"900",color:"#fff"}},"تأكيد استيراد Excel")
  ]));
  hdr.appendChild(el("div",{sty:{fontSize:"13px",color:"rgba(255,255,255,.7)"}},(pd.incRows.length+pd.expRows.length)+" معاملة · "+pd.incRows.length+" دخل · "+pd.expRows.length+" مصروف"));
  var sr=el("div",{sty:{display:"flex",gap:"8px",marginTop:"14px"}});
  var sdata=[{l:"الدخل",v:iT,c:"#6EE7B7"},{l:"المصروفات",v:eT,c:"#FCA5A5"},{l:"الرصيد",v:iT-eT,c:(iT-eT)>=0?"#6EE7B7":"#FCA5A5"}];
  for(var i=0;i<sdata.length;i++){
    var s=sdata[i];
    var sc=el("div",{sty:{flex:"1",background:"rgba(255,255,255,.12)",borderRadius:"12px",padding:"10px"}});
    sc.appendChild(el("div",{sty:{fontSize:"10px",color:"rgba(255,255,255,.6)",fontWeight:"700",marginBottom:"2px"}},s.l));
    sc.appendChild(el("div",{sty:{fontSize:"15px",fontWeight:"900",color:s.c}},fmt(Math.abs(s.v))));
    sr.appendChild(sc);
  }
  hdr.appendChild(sr);
  page.appendChild(hdr);

  var body=el("div",{cls:"content",sty:{paddingBottom:"80px"}});
  body.appendChild(secTitle("سنة البيانات"));
  var yr=inpEl({type:"number",value:String(pd.year),placeholder:"2025",sty:{fontSize:"20px",fontWeight:"900"}});
  body.appendChild(yr);

  // Income preview
  var incKeys=Object.keys(incByCat);
  if(incKeys.length){
    body.appendChild(secTitle("الدخل","8px"));
    var ic=el("div",{cls:"card"});
    for(var i=0;i<incKeys.length;i++){
      var k=incKeys[i];
      var row=el("div",{cls:"tx-row",sty:{borderBottom:i<incKeys.length-1?"1px solid var(--border)":"none"}});
      row.appendChild(el("div",{cls:"tx-icon",sty:{background:"var(--income-bg)"}},"💰"));
      row.appendChild(el("div",{cls:"tx-info"},[el("div",{cls:"tx-name"},k)]));
      row.appendChild(el("div",{cls:"tx-amt",sty:{color:"var(--income)"}},fmt(incByCat[k])));
      ic.appendChild(row);
    }
    body.appendChild(ic);
  }

  // Expense preview
  var expKeys=Object.keys(expByCat);
  if(expKeys.length){
    body.appendChild(secTitle("المصروفات","8px"));
    var ec=el("div",{cls:"card"});
    for(var i=0;i<Math.min(expKeys.length,10);i++){
      var k=expKeys[i];
      var row=el("div",{cls:"tx-row",sty:{borderBottom:i<Math.min(expKeys.length,10)-1?"1px solid var(--border)":"none"}});
      row.appendChild(el("div",{cls:"tx-icon",sty:{background:"var(--expense-bg)"}},"💸"));
      row.appendChild(el("div",{cls:"tx-info"},[el("div",{cls:"tx-name"},k)]));
      row.appendChild(el("div",{cls:"tx-amt",sty:{color:"var(--expense)"}},fmt(expByCat[k])));
      ec.appendChild(row);
    }
    body.appendChild(ec);
  }

  body.appendChild(el("button",{cls:"btn",sty:{background:"var(--income)",marginTop:"8px"},onclick:function(){
    var year=parseInt(yr.value)||pd.year;
    var ts=Date.now();var newTx=[];
    function mapExpCat(lbl){
      var l=lbl.toLowerCase();
      if(l.includes("grocer")||l.includes("بقالة"))return "groceries";
      if(l.includes("food")||l.includes("طعام"))return "food";
      if(l.includes("debt")||l.includes("loan")||l.includes("دين"))return "debt";
      if(l.includes("child")||l.includes("أطفال"))return "children";
      if(l.includes("fuel")||l.includes("وقود")||l.includes("petrol"))return "fuel";
      if(l.includes("car ")&&!l.includes("fuel"))return "car";
      if(l.includes("health")||l.includes("صحة")||l.includes("medical"))return "health";
      if(l.includes("home")||l.includes("بيت")||l.includes("house")||l.includes("rent"))return "home";
      if(l.includes("electric")||l.includes("كهرباء"))return "electricity";
      if(l.includes("mobile")||l.includes("phone")||l.includes("موبايل"))return "mobile";
      if(l.includes("shop")||l.includes("مشتريات"))return "shopping";
      if(l.includes("entertain")||l.includes("ترفيه"))return "entertain";
      if(l.includes("tech")||l.includes("تقنية"))return "tech";
      if(l.includes("travel")||l.includes("سفر"))return "travel";
      if(l.includes("utilit")||l.includes("خدمات"))return "utilities";
      if(l.includes("maid")||l.includes("house made")||l.includes("عمالة"))return "housemaid";
      if(l.includes("wife")||l.includes("زوجة"))return "wife";
      return "other";
    }
    function mapIncCat(lbl){
      var l=lbl.toLowerCase();
      if(l.includes("salary")||l.includes("راتب"))return "salary";
      if(l.includes("shop")||l.includes("متجر"))return "shop";
      if(l.includes("income")||l.includes("دخل"))return "income2";
      return "other";
    }
    for(var i=0;i<pd.incRows.length;i++){var t=pd.incRows[i];newTx.push({id:"xl_i_"+ts+"_"+i,type:"income",catId:mapIncCat(t.label),label:t.label,amount:t.amount,date:year+"-"+String(t.month).padStart(2,"0")+"-01",note:""});}
    for(var i=0;i<pd.expRows.length;i++){var t=pd.expRows[i];newTx.push({id:"xl_e_"+ts+"_"+i,type:"expense",catId:mapExpCat(t.label),label:t.label,amount:t.amount,date:year+"-"+String(t.month).padStart(2,"0")+"-01",note:""});}
    for(var i=0;i<newTx.length;i++)S.txs.push(newTx[i]);
    UI.pivotData=null;save();toast("✓ تم استيراد "+newTx.length+" معاملة");go("home");
  }},"✅ استيراد "+(pd.incRows.length+pd.expRows.length)+" معاملة"));
  body.appendChild(el("button",{cls:"btn btn-ghost",onclick:function(){UI.pivotData=null;go("more");}},"إلغاء"));
  page.appendChild(body);return page;
}

// ════════════════════════════════════════════
//  BACKUP
// ════════════════════════════════════════════
function exportAll(){
  var data=JSON.stringify({_t:"mb2",v:2,d:today(),txs:S.txs},null,2);
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download="ميزانية-البيت-"+today()+".json";a.click();toast("✓ تم التصدير");
}
function importJSON(e){
  var file=e.target.files[0];if(!file)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var d=JSON.parse(ev.target.result);
      if(d._t==="mb2"){if(confirm("سيستبدل كل البيانات. متأكد؟")){S.txs=d.txs||[];save();toast("✓ تم الاستيراد");go("home");}}
      else toast("الملف غير صحيح");
    }catch(err){toast("خطأ في الملف");}
  };
  r.readAsText(file);e.target.value="";
}


// ════════════════════════════════════════════
//  PAGE: ADD/EDIT CATEGORY
// ════════════════════════════════════════════
var CAT_COLORS=["#0EA370","#F97316","#E5484D","#EC4899","#6366F1","#8B5CF6","#14B8A6","#3B82F6","#EAB308","#06B6D4","#A855F7","#F43F5E","#0EA5E9","#D97706","#84CC16","#64748B","#78716C","#9CA3AF"];
var CAT_EMOJIS=["🛒","🍽️","💳","👶","🚗","⛽","🏥","🏠","💡","📱","🛍️","🎮","✈️","💰","💼","🏪","📥","📦","🧹","🔧","🎓","🏋️","💊","🎁","📚","☕","🎵","🍕","🧴","🐾","💈","🌿"];

function pageEditCat(){
  var isEdit=!!UI.editCat;
  var type=UI.editCatType;
  var f=isEdit?UI.editCat:{id:"",lbl:"",em:"😊",c:CAT_COLORS[0]};
  var curColor=f.c||CAT_COLORS[0];
  var curEmoji=f.em||"😊";

  var page=el("div",{sty:{minHeight:"100vh",paddingBottom:"60px",background:"var(--bg)"}});
  var hdr=el("div",{cls:"hdr"});
  hdr.appendChild(el("div",{sty:{display:"flex",alignItems:"center",gap:"14px"}},[
    el("button",{cls:"back-btn",onclick:function(){go("more");}},["←"]),
    el("div",{sty:{fontSize:"19px",fontWeight:"900",color:"#fff"}},isEdit?"تعديل الفئة":"فئة جديدة")
  ]));
  page.appendChild(hdr);

  var body=el("div",{cls:"content"});

  // Preview
  var preview=el("div",{cls:"card card-p",sty:{display:"flex",alignItems:"center",gap:"14px",marginBottom:"0"}});
  var previewIcon=el("div",{sty:{width:"48px",height:"48px",borderRadius:"14px",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"24px",background:curColor+"22",flexShrink:"0"}},curEmoji);
  var previewLbl=el("div",{sty:{flex:"1",fontSize:"16px",fontWeight:"800",color:"var(--text)"}},f.lbl||"اسم الفئة");
  preview.appendChild(previewIcon);preview.appendChild(previewLbl);
  body.appendChild(preview);

  // Name
  body.appendChild(secTitle("اسم الفئة","4px"));
  var ni=inpEl({value:f.lbl||"",placeholder:"مثال: تأمين، رياضة، قهوة..."});
  ni.addEventListener("input",function(){previewLbl.textContent=ni.value||"اسم الفئة";});
  body.appendChild(ni);

  // Emoji picker
  body.appendChild(secTitle("الأيقونة","4px"));
  var emojiWrap=el("div",{sty:{display:"flex",flexWrap:"wrap",gap:"8px"}});
  function setEmoji(em){
    curEmoji=em;previewIcon.textContent=em;
    var btns=emojiWrap.querySelectorAll("button");
    for(var i=0;i<btns.length;i++){btns[i].style.borderColor="var(--border)";btns[i].style.background="var(--surface2)";}
  }
  for(var i=0;i<CAT_EMOJIS.length;i++){
    (function(em){
      var b=el("button",{sty:{width:"42px",height:"42px",borderRadius:"10px",border:"2px solid",
        borderColor:curEmoji===em?"var(--accent)":"var(--border)",
        background:curEmoji===em?"var(--accent-bg)":"var(--surface2)",
        fontSize:"20px",cursor:"pointer"},
        onclick:function(){setEmoji(em);}},em);
      emojiWrap.appendChild(b);
    })(CAT_EMOJIS[i]);
  }
  // Custom emoji input
  var customEm=inpEl({value:"",placeholder:"أو اكتب أيقونة...",maxlength:"2",sty:{width:"120px",textAlign:"center",fontSize:"20px"}});
  customEm.addEventListener("input",function(){if(customEm.value.trim())setEmoji(customEm.value.trim());});
  emojiWrap.appendChild(customEm);
  body.appendChild(emojiWrap);

  // Color picker
  body.appendChild(secTitle("اللون","4px"));
  var colorWrap=el("div",{sty:{display:"flex",flexWrap:"wrap",gap:"8px"}});
  function setColor(c){
    curColor=c;previewIcon.style.background=c+"22";
    var btns=colorWrap.querySelectorAll("button");
    for(var i=0;i<btns.length;i++){btns[i].style.border="3px solid transparent";}
  }
  for(var i=0;i<CAT_COLORS.length;i++){
    (function(c){
      var b=el("button",{sty:{width:"36px",height:"36px",borderRadius:"10px",background:c,
        border:curColor===c?"3px solid var(--text)":"3px solid transparent",cursor:"pointer"},
        onclick:function(){setColor(c);}});
      colorWrap.appendChild(b);
    })(CAT_COLORS[i]);
  }
  body.appendChild(colorWrap);

  // Save
  var saveFn=function(){
    var name=ni.value.trim();if(!name){toast("أدخل اسم الفئة");return;}
    var cats=type==="income"?INC_CATS:EXP_CATS;
    if(isEdit){
      for(var i=0;i<cats.length;i++){
        if(cats[i].id===f.id){cats[i]=Object.assign({},cats[i],{lbl:name,em:curEmoji,c:curColor});break;}
      }
    } else {
      var newId="cat_"+Date.now();
      cats.push({id:newId,lbl:name,em:curEmoji,c:curColor});
    }
    if(type==="income"){INC_CATS=cats;S.incCats=cats;}
    else{EXP_CATS=cats;S.expCats=cats;}
    save();toast(isEdit?"✓ تم الحفظ":"✓ تمت الإضافة");go("more");
  };

  var btnRow=el("div",{sty:{display:"flex",gap:"10px",marginTop:"8px"}});
  btnRow.appendChild(el("button",{cls:"btn btn-accent",onclick:saveFn},isEdit?"💾 حفظ":"✅ إضافة"));
  if(isEdit){
    var fid=f.id;
    btnRow.appendChild(el("button",{cls:"btn btn-danger",sty:{width:"auto",padding:"14px 18px"},onclick:function(){
      confirm2("حذف الفئة؟",f.lbl,function(){
        var cats=type==="income"?INC_CATS:EXP_CATS;
        var nc=[];for(var i=0;i<cats.length;i++)if(cats[i].id!==fid)nc.push(cats[i]);
        if(type==="income"){INC_CATS=nc;S.incCats=nc;}else{EXP_CATS=nc;S.expCats=nc;}
        save();toast("تم الحذف");go("more");
      });
    }},"🗑️"));
  }
  body.appendChild(btnRow);
  page.appendChild(body);return page;
}
// ════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════
function render(){
  applyTheme();
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!S.onboarded){root.appendChild(pageOnboard());return;}
  var pages={
    home:pageHome,
    incList:function(){return pageTxList("income");},
    expList:function(){return pageTxList("expense");},
    addInc:function(){UI.editTx=null;return pageAETx("income");},
    addExp:function(){UI.editTx=null;return pageAETx("expense");},
    editTx:function(){return pageAETx(UI.editTx?UI.editTx.type:"expense");},
    report:pageReport,
    more:pageMore,
    confirmXL:pageConfirmXL,
    editCat:pageEditCat,
  };
  var fn=pages[UI.view];
  if(fn)root.appendChild(fn());
  else{root.appendChild(pageHome());}
}

if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",render);}
else{render();}
</script>
