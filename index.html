<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"/>
<meta name="referrer" content="no-referrer"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="ميزانية البيت"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1D6FA4" id="meta-theme"/>
<title>ميزانية البيت</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#F7F8FA; --surface:#FFFFFF; --surface2:#F0F2F5; --border:#E8ECF2;
  --text:#111827; --text2:#6B7280; --text3:#9CA3AF;
  --income:#0EA370; --income-bg:#E6F7F1;
  --expense:#E5484D; --expense-bg:#FDEAEB;
  --accent:#1D6FA4; --accent-bg:#E8F2FA;
  --commit:#7C3AED; --commit-bg:#EDE9FE;
  --amber:#D97706; --amber-bg:#FEF3C7;
  --shadow:0 1px 3px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
  --r:14px; --r-sm:10px;
  --theme-accent:#1D6FA4; --theme-hdr1:#1D6FA4; --theme-hdr2:#1558A0;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#0E1014; --surface:#191C22; --surface2:#232730; --border:#2F3440;
  --text:#F2F4F7; --text2:#A3AAB6; --text3:#6E7583;
  --income:#2BC48A; --income-bg:#0F2A21;
  --expense:#F06A6E; --expense-bg:#2E1618;
  --commit:#A78BFA; --commit-bg:#241B3D;
  --amber:#F5B544; --amber-bg:#2E2412;
  --shadow:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
}
:root[data-theme="dark"] .alert-warn { border-color:#6B5418; }
:root[data-theme="dark"] .alert-over { border-color:#6B2A2D; }
:root[data-theme="dark"] .hdr { filter:brightness(.82); }
:root[data-theme="dark"] .quick-btn { border:1px solid var(--border); }
.chip-scroll { display:flex; overflow-x:auto; margin:12px -18px 0; padding:0 18px 2px; }
.chip-scroll .cat-chip { flex-shrink:0; margin:0 0 0 6px; padding:6px 11px; }
.chip-scroll .cat-chip.chip-on { color:var(--text); border-color:var(--theme-accent); background:var(--accent-bg); }
.chart-cap { font-size:13px; font-weight:800; color:var(--text); margin:14px 0 6px; }
.chart-svg { display:block; overflow:visible; font-family:inherit; }
.chart-hint { font-size:11px; color:var(--text3); text-align:center; margin-top:8px; }
.chart-legend-row { display:flex; font-size:11px; font-weight:700; color:var(--text2); margin-bottom:4px; }
.chart-legend-row span { display:flex; align-items:center; margin-left:12px; }
.chart-legend-row i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-left:5px; }
.sel-head { display:flex; justify-content:space-between; font-size:14px; font-weight:900; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
.sel-list { margin:8px -18px -16px; border-top:1px solid var(--border); }
.seg { display:flex; background:var(--surface2); border-radius:10px; padding:3px; }
.seg button { flex:1; padding:8px 4px; border-radius:8px; font-size:13px; font-weight:700; color:var(--text2); }
.seg button.on { background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; background:var(--bg); }
body { font-family:'Cairo',-apple-system,BlinkMacSystemFont,sans-serif; max-width:430px; margin:0 auto; color:var(--text); overflow-x:hidden; -webkit-font-smoothing:antialiased; }
button, input, select { font-family:inherit; }
button { cursor:pointer; border:none; background:none; }
::-webkit-scrollbar { width:0; height:0; }
input { -webkit-appearance:none; }

.page { min-height:100vh; padding-bottom:80px; }
.content { padding:16px; display:flex; flex-direction:column; }
.content > * + * { margin-top:12px; }
.card { background:var(--surface); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.card-p { padding:16px 18px; }

.hdr { background:linear-gradient(145deg, var(--theme-hdr1) 0%, var(--theme-hdr2) 100%); padding:52px 18px 20px; position:relative; }
.hdr-title { font-size:11px; font-weight:700; letter-spacing:1.5px; color:rgba(255,255,255,.65); margin-bottom:4px; }

.balance-card { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); border-radius:18px; padding:18px; margin-bottom:14px; }
.balance-main { display:flex; justify-content:center; align-items:baseline; margin-bottom:4px; }
.balance-main > * + * { margin-right:6px; }
.balance-num { font-size:36px; font-weight:900; color:#fff; letter-spacing:-1px; }
.balance-cur { font-size:13px; font-weight:600; color:rgba(255,255,255,.6); }
.balance-label { font-size:11px; color:rgba(255,255,255,.55); font-weight:600; letter-spacing:.5px; text-align:center; margin-bottom:14px; }
.scale-side { display:flex; flex-direction:column; }
.scale-side > * + * { margin-top:2px; }
.scale-lbl { font-size:10px; color:rgba(255,255,255,.55); font-weight:700; }
.scale-val { font-size:15px; font-weight:900; }
.scale-val.inc { color:#6EE7B7; } .scale-val.exp { color:#FCA5A5; } .scale-val.com { color:#C4B5FD; }
.scale-divider { width:1px; height:36px; background:rgba(255,255,255,.2); margin:0 auto; }
.scale-bar-wrap { margin-top:10px; position:relative; height:4px; background:rgba(255,255,255,.15); border-radius:99px; overflow:hidden; }
.scale-bar-fill { position:absolute; top:0; right:0; height:100%; border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }

.month-scroll { display:flex; overflow-x:auto; padding-bottom:2px; }
.month-scroll > * + * { margin-right:6px; }
.mtab { flex-shrink:0; padding:6px 14px; border-radius:20px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:rgba(255,255,255,.75); font-size:12px; font-weight:700; transition:all .15s; }
.mtab.active { background:rgba(255,255,255,.9); color:var(--theme-hdr2); border-color:transparent; }

.quick-bar { display:grid; grid-template-columns:1fr 1fr; grid-gap:10px; }
.quick-btn { display:flex; align-items:center; justify-content:center; padding:13px; border-radius:var(--r); font-size:14px; font-weight:800; transition:opacity .15s; }
.quick-btn:active { opacity:.8; }
.quick-inc { background:var(--income-bg); color:var(--income); }
.quick-exp { background:var(--expense-bg); color:var(--expense); }

.stats-row { display:grid; grid-template-columns:1fr 1fr 1fr; grid-gap:8px; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; grid-gap:8px; }
.stat-card { background:var(--surface); border-radius:var(--r-sm); box-shadow:var(--shadow); padding:12px; text-align:center; }
.stat-lbl { font-size:10px; color:var(--text2); font-weight:700; margin-bottom:4px; }
.stat-val { font-size:17px; font-weight:900; }
.stat-cur { font-size:10px; color:var(--text3); }

.sec-title { font-size:11px; font-weight:800; letter-spacing:1.5px; color:var(--text3); margin-bottom:-4px; }

.tx-row { display:flex; align-items:center; padding:12px 16px; }
.tx-row > * + * { margin-right:12px; }
.tx-icon { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.tx-info { flex:1; min-width:0; }
.tx-name { font-size:13px; font-weight:700; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tx-sub  { font-size:11px; color:var(--text3); margin-top:1px; }
.tx-amt  { font-size:15px; font-weight:900; flex-shrink:0; }

.cat-grid { display:flex; flex-wrap:wrap; margin:-3px; }
.cat-chip { margin:3px; display:flex; align-items:center; padding:8px 12px; border-radius:22px; border:1.5px solid var(--border); background:var(--surface2); font-size:12px; font-weight:700; color:var(--text2); transition:all .15s; }
.wrap-grid { display:flex; flex-wrap:wrap; margin:-3px; }
.wrap-grid > * { margin:3px; }

.inp { width:100%; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--r-sm); padding:12px 14px; font-size:16px; color:var(--text); outline:none; display:block; transition:border-color .2s, background .2s; }
.inp:focus { border-color:var(--theme-accent); background:var(--surface); }
.inp-big { font-size:28px; font-weight:900; text-align:center; padding:14px; }
.inp-ltr { direction:ltr; text-align:left; }

.btn { width:100%; border:none; border-radius:var(--r); padding:14px; font-size:15px; font-weight:800; color:#fff; display:block; text-align:center; transition:opacity .15s; }
.btn:active { opacity:.85; }
.btn[disabled] { opacity:.5; }
.btn-ghost  { background:var(--surface2) !important; color:var(--text) !important; border:1.5px solid var(--border); }
.btn-danger { background:var(--expense-bg) !important; color:var(--expense) !important; }
.btn-accent { background:var(--theme-accent) !important; }
.btn-commit { background:var(--commit) !important; }
.btn-wa     { background:#1FA855 !important; }
.btn-row { display:flex; }
.btn-row > * + * { margin-right:10px; }
.link-btn { color:var(--theme-accent); font-size:14px; font-weight:700; padding:8px; }

.chart-wrap { display:flex; align-items:center; padding:16px 18px; }
.chart-wrap > * + * { margin-right:16px; }
.donut-wrap { position:relative; width:110px; height:110px; flex-shrink:0; }
.donut-center { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.donut-center-val { font-size:15px; font-weight:900; color:var(--text); }
.donut-center-lbl { font-size:9px; color:var(--text3); font-weight:700; }
.chart-legend { flex:1; display:flex; flex-direction:column; min-width:0; }
.chart-legend > * + * { margin-top:7px; }
.legend-row { display:flex; align-items:center; }
.legend-row > * + * { margin-right:8px; }
.legend-dot { width:9px; height:9px; border-radius:3px; flex-shrink:0; }
.legend-lbl { flex:1; font-size:12px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend-val { font-size:12px; font-weight:800; color:var(--text2); }

.tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--surface); border-top:1px solid var(--border); display:grid; grid-template-columns:repeat(5,1fr); z-index:100; box-shadow:0 -2px 12px rgba(0,0,0,.06); padding-bottom:env(safe-area-inset-bottom); }
.tab-btn { display:flex; flex-direction:column; align-items:center; padding:9px 0 12px; color:var(--text3); transition:color .15s; }
.tab-btn.active { color:var(--theme-accent); }
.tab-icon { font-size:20px; line-height:1; margin-bottom:3px; }
.tab-lbl  { font-size:10px; font-weight:700; }

.back-btn { width:40px; height:40px; border-radius:12px; flex-shrink:0; background:rgba(255,255,255,.2); border:1.5px solid rgba(255,255,255,.3); color:#fff; font-size:18px; display:flex; align-items:center; justify-content:center; margin-left:12px; }

.toast { position:fixed; top:18px; left:50%; transform:translateX(-50%) translateY(-10px); background:var(--text); color:var(--bg); border-radius:12px; padding:10px 20px; z-index:900; font-size:13px; font-weight:700; white-space:nowrap; opacity:0; pointer-events:none; transition:all .25s; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

.overlay { position:fixed; top:0; right:0; bottom:0; left:0; background:rgba(17,24,39,.5); z-index:300; display:none; align-items:flex-end; }
.overlay.show { display:flex; }
.sheet { background:var(--surface); width:100%; max-width:430px; margin:0 auto; border-radius:22px 22px 0 0; padding:28px 20px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,.12); max-height:85vh; overflow-y:auto; }
.sheet > * + * { margin-top:12px; }
.sheet-handle { width:36px; height:4px; background:var(--border); border-radius:99px; margin:0 auto 8px; }
.sheet-title { font-size:17px; font-weight:900; color:var(--text); }
.sheet-sub { font-size:13px; color:var(--text2); line-height:1.7; white-space:pre-line; }

.empty { text-align:center; padding:60px 24px; }
.empty-icon { font-size:48px; margin-bottom:12px; }
.empty-title { font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; }
.empty-body  { font-size:13px; color:var(--text3); line-height:1.7; white-space:pre-line; }

.tbl-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { padding:9px 12px; background:var(--surface2); color:var(--text2); font-weight:800; text-align:right; border-bottom:1px solid var(--border); font-size:11px; }
td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text); text-align:right; }
tr:last-child td { border-bottom:none; }
.td-inc { color:var(--income); font-weight:800; } .td-exp { color:var(--expense); font-weight:800; } .td-bal { font-weight:900; }

/* Gate screens (login / lock / setup) */
.gate { min-height:100vh; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; text-align:center; }
.gate > * + * { margin-top:12px; }
.gate-form { width:100%; max-width:340px; text-align:right; }
.gate-form > * + * { margin-top:10px; }
.ob-emoji { font-size:64px; }
.ob-title { font-size:23px; font-weight:900; color:var(--text); line-height:1.3; }
.ob-body  { font-size:14px; color:var(--text2); line-height:1.8; max-width:340px; white-space:pre-line; }
.ob-dots  { display:flex; justify-content:center; margin:12px 0; }
.ob-dot + .ob-dot { margin-right:8px; }
.ob-dot { height:7px; width:7px; border-radius:99px; background:var(--border); transition:all .3s; }
.ob-dot.active { background:var(--theme-accent); width:24px; }
.gate-err { color:var(--expense); font-size:13px; font-weight:700; min-height:18px; }
.brand-foot { font-size:11px; color:var(--text3); margin-top:24px; }
.spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--theme-accent); border-radius:50%; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

.pin-dots { display:flex; justify-content:center; direction:ltr; margin:6px 0; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid var(--text3); margin:0 7px; transition:all .15s; }
.pin-dot.on { background:var(--theme-accent); border-color:var(--theme-accent); }
.pin-pad { display:grid; grid-template-columns:repeat(3,72px); grid-gap:14px; justify-content:center; direction:ltr; margin-top:14px; }
.pin-key { width:72px; height:72px; border-radius:50%; background:var(--surface2); font-size:26px; font-weight:800; color:var(--text); }
.pin-key:active { background:var(--border); }
.pin-key.ghost { background:none; font-size:15px; color:var(--text2); }
.shake { animation:shake .35s; }
@keyframes shake { 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }

.bar-chart > * + * { margin-top:10px; }
.bar-row { display:flex; align-items:center; }
.bar-row > * + * { margin-right:10px; }
.bar-row-lbl { width:84px; font-size:12px; font-weight:700; color:var(--text2); text-align:right; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-track { flex:1; background:var(--surface2); border-radius:99px; height:8px; overflow:hidden; }
.bar-fill  { height:100%; border-radius:99px; transition:width .5s; }
.bar-val   { font-size:12px; font-weight:800; color:var(--text); }

.alert-banner { border-radius:var(--r); padding:12px 14px; display:flex; align-items:center; }
.alert-banner > * + * { margin-right:10px; }
.alert-warn { background:var(--amber-bg); border:1.5px solid #FCD34D; }
.alert-over { background:var(--expense-bg); border:1.5px solid #FCA5A5; }
.alert-info { background:var(--accent-bg); border:1.5px solid var(--border); }
.alert-msg  { flex:1; font-size:13px; font-weight:700; color:var(--text); }
.alert-x    { font-size:16px; color:var(--text3); padding:2px 6px; }

.commit-banner { background:linear-gradient(135deg,#7C3AED,#5B21B6); border-radius:var(--r); padding:14px 16px; display:flex; align-items:center; }
.commit-banner > * + * { margin-right:12px; }
.commit-banner-info { flex:1; }
.commit-banner-title { font-size:14px; font-weight:900; color:#fff; margin-bottom:2px; }
.commit-banner-sub   { font-size:12px; color:rgba(255,255,255,.75); }

.list-btn { display:flex; align-items:center; padding:14px 18px; width:100%; text-align:right; }
.list-btn > * + * { margin-right:12px; }
.list-btn + .list-btn { border-top:1px solid var(--border); }
.list-ico { width:40px; height:40px; border-radius:11px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0; }
.list-txt { flex:1; }
.list-t { font-size:14px; font-weight:700; color:var(--text); }
.list-s { font-size:11px; color:var(--text3); margin-top:1px; }
.list-arrow { color:var(--text3); font-size:18px; }
.kv { display:flex; justify-content:space-between; padding:11px 18px; font-size:13px; }
.kv + .kv { border-top:1px solid var(--border); }
.kv-k { color:var(--text2); font-weight:700; }
.kv-v { color:var(--text); font-weight:800; }
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>

<div class="overlay" id="modal-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="modal-title"></div>
    <div class="sheet-sub" id="modal-body"></div>
    <div id="modal-warn" style="display:none;font-size:12px;color:var(--expense)">⚠️ لا يمكن التراجع عن هذا الإجراء</div>
    <div class="btn-row">
      <button class="btn btn-danger" id="modal-confirm">تأكيد</button>
      <button class="btn btn-ghost"  id="modal-cancel">إلغاء</button>
    </div>
  </div>
</div>

<div class="overlay" id="commit-overlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📋 الالتزامات الشهرية</div>
    <div class="sheet-sub" id="commit-subtitle"></div>
    <div id="commit-list"></div>
    <div class="btn-row">
      <button class="btn btn-commit" id="commit-apply-btn">✅ تطبيق الكل</button>
      <button class="btn btn-ghost" id="commit-skip-btn">تخطي</button>
    </div>
  </div>
</div>

<div class="overlay" id="ask-overlay">
  <div class="sheet" id="ask-sheet"></div>
</div>

<script src="firebase-config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="vendor/xlsx.full.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
