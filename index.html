<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>ميزانية البيت</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="ميزانية البيت"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="format-detection" content="telephone=no"/>
<meta name="theme-color" content="#2563EB"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#F0F4F8;}
body{font-family:'Cairo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;max-width:430px;margin:0 auto;color:#1A2235;overflow-x:hidden;}
button,input,select,textarea{font-family:'Cairo',sans-serif;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{width:0;}
input{-webkit-appearance:none;}
.page{min-height:100vh;padding-bottom:110px;}
/* iOS safe area */
.tabbar{padding-bottom:env(safe-area-inset-bottom,0px);}
.fab{bottom:calc(78px + env(safe-area-inset-bottom,0px));}
.page{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px));}
/* iOS input fixes */
input,select{font-size:16px;} /* prevent auto-zoom on iOS */
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
* {-webkit-text-size-adjust:100%;}

/* ── TOKENS ── */
/* ── THEME: BLUE (default) ── */
:root{
  --bg:#F0F5FF;
  --surface:#FFFFFF;
  --surface2:#EEF3FF;
  --surface3:#E0EAFF;
  --border:#C7D7F5;
  --text:#111827;
  --text2:#374151;
  --text3:#9CA3AF;
  --green:#15803D;
  --green-dim:#DCFCE7;
  --red:#DC2626;
  --red-dim:#FEE2E2;
  --blue:#5B9BD5;
  --blue-dim:#DBEAFE;
  --amber:#D97706;
  --amber-dim:#FEF3C7;
  --purple:#7C3AED;
  --accent:#5B9BD5;
  --hdr-start:#7BB3E0;
  --hdr-end:#5B9BD5;
  --fab:#5B9BD5;
}
/* ── THEME: PINK ── */
body.theme-pink{
  --bg:#FFF0F5;
  --surface:#FFFFFF;
  --surface2:#FFE8F2;
  --surface3:#FFD6E8;
  --border:#F9C0D8;
  --text:#111827;
  --text2:#374151;
  --text3:#9CA3AF;
  --green:#15803D;
  --green-dim:#DCFCE7;
  --red:#DC2626;
  --red-dim:#FEE2E2;
  --blue:#E75480;
  --blue-dim:#FFD6E8;
  --amber:#D97706;
  --amber-dim:#FEF3C7;
  --purple:#C2185B;
  --accent:#E75480;
  --hdr-start:#F4A7C3;
  --hdr-end:#E75480;
  --fab:#E75480;
}

/* ── LAYOUT ── */
.hdr{padding:52px 20px 22px;position:relative;}
.content{padding:16px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--border);}
.card-inner{padding:16px 18px;}

/* ── INPUTS ── */
.inp{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;font-size:15px;outline:none;color:var(--text);transition:border-color .2s;display:block;}
.inp:focus{border-color:var(--accent);background:var(--surface3);}
select.inp{cursor:pointer;}

/* ── BUTTONS ── */
.btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;color:#fff;display:block;text-align:center;transition:opacity .15s;}
.btn:active{opacity:.8;}
.btn-ghost{background:var(--surface2)!important;border:1px solid var(--border);color:var(--text)!important;}
.fab{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.5);z-index:50;text-align:center;}

/* ── TYPE ── */
.ttl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;color:var(--text2);}
.num-big{font-size:32px;font-weight:900;letter-spacing:-1px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;}

/* ── PROGRESS ── */
.prog-track{background:var(--surface3);border-radius:99px;height:5px;overflow:hidden;margin-top:8px;}
.prog-fill{height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;background:rgba(26,34,53,.6);z-index:200;display:none;align-items:flex-end;backdrop-filter:blur(4px);}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:28px;border-top:1px solid var(--border);box-shadow:0 -8px 40px rgba(0,0,0,.12);}

/* ── TOAST ── */
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:var(--surface3);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 20px;z-index:300;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
.toast.show{display:block;}

/* ── TAB BAR ── */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:60;box-shadow:0 -4px 20px rgba(0,0,0,.08);}
.tabbar button{flex:1;padding:9px 0 13px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);transition:color .15s;}
.tabbar button.active{color:var(--accent);}
.tabbar button span.icon{font-size:20px;}
.tabbar button span.lbl{font-size:10px;font-weight:700;}
.card{box-shadow:0 1px 8px rgba(0,0,0,.06);}

/* ── STAT PILL ── */
.stat-row{display:flex;gap:8px;}
.stat-pill{flex:1;background:var(--surface2);border-radius:12px;padding:11px 12px;border:1px solid var(--border);}
.stat-pill .sp-lbl{font-size:10px;color:var(--text2);font-weight:700;margin-bottom:2px;}
.stat-pill .sp-val{font-size:17px;font-weight:900;}
.stat-pill .sp-cur{font-size:10px;color:var(--text3);}

/* ── MONTH TABS ── */
.month-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
.month-scroll::-webkit-scrollbar{height:0;}
.mtab{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'Cairo',sans-serif;}
.mtab.active{background:var(--accent);color:#0F1117;border-color:var(--accent);}

/* ── TABLES ── */
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{padding:9px 12px;background:var(--surface3);color:var(--text2);font-weight:700;text-align:right;border-bottom:1px solid var(--border);}
td{padding:9px 12px;border-bottom:1px solid var(--border);color:var(--text);text-align:right;}
tr:last-child td{border-bottom:none;}

/* ── CATEGORY ICON ── */
.cat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}

/* ── INCOME/EXPENSE INDICATOR ── */
.inc-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;}
.exp-dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="cdel-overlay">
  <div class="sheet" id="cdel-sheet">
    <div style="font-size:16px;font-weight:800;margin-bottom:6px;" id="cdel-title"></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:4px;" id="cdel-name"></div>
    <div style="font-size:12px;color:var(--red);margin-bottom:16px;display:none;" id="cdel-warn">سيتم حذف كل ما بداخله</div>
    <div style="display:flex;gap:10px;">
      <button class="btn" id="cdel-confirm" style="background:var(--red);">حذف</button>
      <button class="btn btn-ghost" onclick="closeCdel()">إلغاء</button>
    </div>
  </div>
</div>

<script>
// iOS polyfills
if(!Object.entries){Object.entries=function(o){return Object.keys(o).map(function(k){return[k,o[k]];});};}
if(!Array.from){Array.from=function(a){return Array.prototype.slice.call(a);};}

// ════════════════════════════════════════════
//  CONSTANTS & STATE
// ════════════════════════════════════════════
var CUR="د.ب";
var MONTHS_AR=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var EXPENSE_CATS=[
  {id:"groceries",  label:"بقالة",       emoji:"🛒", color:"#22C55E"},
  {id:"food",       label:"طعام",        emoji:"🍽️", color:"#F97316"},
  {id:"debt",       label:"ديون",        emoji:"💳", color:"#EF4444"},
  {id:"children",   label:"أطفال",       emoji:"👶", color:"#EC4899"},
  {id:"car",        label:"سيارة",       emoji:"🚗", color:"#6366F1"},
  {id:"fuel",       label:"وقود",        emoji:"⛽", color:"#8B5CF6"},
  {id:"health",     label:"صحة",         emoji:"🏥", color:"#14B8A6"},
  {id:"home",       label:"بيت",         emoji:"🏠", color:"#3B82F6"},
  {id:"electricity",label:"كهرباء",      emoji:"💡", color:"#F59E0B"},
  {id:"mobile",     label:"موبايل",      emoji:"📱", color:"#06B6D4"},
  {id:"shopping",   label:"مشتريات",     emoji:"🛍️", color:"#A855F7"},
  {id:"entertainment",label:"ترفيه",     emoji:"🎮", color:"#F43F5E"},
  {id:"tech",       label:"تقنية",       emoji:"💻", color:"#64748B"},
  {id:"travel",     label:"سفر",         emoji:"✈️", color:"#0EA5E9"},
  {id:"utilities",  label:"خدمات",       emoji:"🔧", color:"#78716C"},
  {id:"housemaid",  label:"عمالة منزلية",emoji:"🧹", color:"#84CC16"},
  {id:"wife",       label:"الزوجة",      emoji:"👩", color:"#EC4899"},
  {id:"other",      label:"أخرى",       emoji:"📦", color:"#6B7280"},
];
var INCOME_CATS=[
  {id:"salary",  label:"الراتب",     emoji:"💰", color:"#22C55E"},
  {id:"income2", label:"دخل ثانوي", emoji:"💼", color:"#3B82F6"},
  {id:"shop",    label:"المتجر",    emoji:"🏪", color:"#F59E0B"},
  {id:"other",   label:"أخرى",      emoji:"📥", color:"#8B5CF6"},
];

function ld(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// Data model
var state={
  transactions: ld("bgt_tx",[]),
  budgets: ld("bgt_bud",{}),
  annualBudget: ld("bgt_ann",{income:0,expense:0}),
  groceries: ld("bgt_gr",[]),
  onboarded: ld("bgt_on",false),
  theme: ld("bgt_theme","blue"),
};

var ui={
  view: state.onboarded?"home":"onboard",
  activeTab:"home",
  obStep:0,
  selMonth: new Date().toISOString().slice(0,7),
  editTx: null,
  editGr: null,
  cdelCb: null,
  reportMonth: new Date().toISOString().slice(0,7),
};

function persist(){
  sv("bgt_tx",state.transactions);
  sv("bgt_bud",state.budgets);
  sv("bgt_ann",state.annualBudget);
  sv("bgt_gr",state.groceries);
  sv("bgt_on",state.onboarded);
  sv("bgt_theme",state.theme);
}
function applyTheme(){
  document.body.className=state.theme==="pink"?"theme-pink":"";
}

function uid(){return "_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);}
function fmt(n){return Number(n||0).toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function today(){return new Date().toISOString().slice(0,10);}
function cleanAmt(v){return parseFloat(String(v||0).replace(/,/g,"").replace(/[^0-9.]/g,""))||0;}
function monthLabel(ym){var p=ym.split("-");return MONTHS_AR[parseInt(p[1])-1]+" "+p[0];}
function getCat(type,id){return (type==="income"?INCOME_CATS:EXPENSE_CATS).find(function(c){return c.id===id;})||{label:id,emoji:"📦",color:"#6B7280"};}

// ── Monthly aggregates
function monthStats(ym){
  var txs=state.transactions.filter(function(t){return t.date.slice(0,7)===ym;});
  var income=txs.filter(function(t){return t.type==="income";}).reduce(function(s,t){return s+t.amount;},0);
  var expense=txs.filter(function(t){return t.type==="expense";}).reduce(function(s,t){return s+t.amount;},0);
  var byExpCat={};
  EXPENSE_CATS.forEach(function(c){
    byExpCat[c.id]=txs.filter(function(t){return t.type==="expense"&&t.catId===c.id;}).reduce(function(s,t){return s+t.amount;},0);
  });
  var byIncCat={};
  INCOME_CATS.forEach(function(c){
    byIncCat[c.id]=txs.filter(function(t){return t.type==="income"&&t.catId===c.id;}).reduce(function(s,t){return s+t.amount;},0);
  });
  return{income,expense,balance:income-expense,txs,byExpCat,byIncCat};
}

// ── All months with data
function dataMonths(){
  var m={};state.transactions.forEach(function(t){m[t.date.slice(0,7)]=true;});
  var arr=Object.keys(m).sort().reverse();
  if(!arr.length)arr=[new Date().toISOString().slice(0,7)];
  return arr;
}

// ════════════════════════════════════════════
//  DOM HELPERS
// ════════════════════════════════════════════
var _tt;
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove("show");},2400);}
function go(v){ui.view=v;render();}

function openCdel(title,name,warn,cb){
  document.getElementById("cdel-title").textContent=title;
  document.getElementById("cdel-name").textContent=name;
  document.getElementById("cdel-warn").style.display=warn?"block":"none";
  document.getElementById("cdel-overlay").classList.add("show");
  ui.cdelCb=cb;
}
function closeCdel(){document.getElementById("cdel-overlay").classList.remove("show");ui.cdelCb=null;}
document.getElementById("cdel-confirm").onclick=function(){if(ui.cdelCb){ui.cdelCb();closeCdel();}};
document.getElementById("cdel-overlay").onclick=function(e){if(e.target.id==="cdel-overlay")closeCdel();};

function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(kv){
    var k=kv[0],v=kv[1];
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  });
  if(kids!=null){[kids].flat().forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);});}
  return e;
}
function div(cls,style,kids){return el("div",{class:cls,style:style||{}},kids);}
function ttlEl(txt,mt){var d=el("div",{class:"ttl"});if(mt)d.style.marginTop=mt;d.textContent=txt;return d;}
function inpEl(attrs){
  var extra=attrs.style||{};delete attrs.style;
  var i=el("input",Object.assign({class:"inp"},attrs));
  Object.assign(i.style,extra);
  return i;
}
function progBar(val,max,color){
  if(!max||max<=0)return null;
  var pct=Math.min(100,(val/max)*100),over=val>max;
  var wrap=el("div");
  var track=el("div",{class:"prog-track"});
  var fill=el("div",{class:"prog-fill",style:{width:pct+"%",background:over?"var(--red)":color}});
  track.appendChild(fill);wrap.appendChild(track);
  var lbl=el("div",{style:{display:"flex",justifyContent:"space-between",marginTop:5,fontSize:11,fontWeight:700,color:"var(--text3)"}});
  lbl.appendChild(el("span",null,Math.round(pct)+"%"));
  var rem=over?el("span",{style:{color:"var(--red)"}},"تجاوز "+fmt(val-max)+" "+CUR):el("span",{style:{color:"#374151"}},"متبقي "+fmt(max-val)+" "+CUR);
  lbl.appendChild(rem);
  wrap.appendChild(lbl);
  return wrap;
}

// ════════════════════════════════════════════
//  TAB BAR
// ════════════════════════════════════════════
function tabBar(){
  var bar=el("div",{class:"tabbar"});
  var tabs=[
    {id:"home",   icon:"🏠", label:"الرئيسية"},
    {id:"income", icon:"💰", label:"الدخل"},
    {id:"expense",icon:"💸", label:"المصروفات"},
    {id:"report", icon:"📊", label:"التقارير"},
    {id:"grocery",icon:"🛒", label:"المقاضي"},
  ];
  tabs.forEach(function(t){
    var b=el("button",{class:ui.activeTab===t.id?"active":""});
    b.appendChild(el("span",{class:"icon"},t.icon));
    b.appendChild(el("span",{class:"lbl"},t.label));
    b.addEventListener("click",function(){
      ui.activeTab=t.id;
      if(t.id==="home")go("home");
      else if(t.id==="income")go("incomeList");
      else if(t.id==="expense")go("expenseList");
      else if(t.id==="report")go("report");
      else if(t.id==="grocery")go("grocery");
    });
    bar.appendChild(b);
  });
  return bar;
}

// ════════════════════════════════════════════
//  PAGE: HOME DASHBOARD
// ════════════════════════════════════════════
function pageHome(){
  ui.activeTab="home";
  var ym=ui.selMonth;
  var st=monthStats(ym);
  var allM=dataMonths();
  var budKey=ym;
  var mBud=(state.budgets[budKey]||{});
  var totalExpBud=EXPENSE_CATS.reduce(function(s,c){return s+(mBud[c.id]||0);},0);

  var page=el("div",{class:"page"});

  // ── Header
  var hdr=el("div",{class:"hdr",style:{background:"linear-gradient(135deg,var(--hdr-start) 0%,var(--hdr-end) 100%)",borderBottom:"1px solid var(--border)"}});
  var topRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}});
  topRow.appendChild(el("div",null,[
    el("div",{style:{fontSize:12,color:"#111827",fontWeight:800,letterSpacing:1,marginBottom:4}},"لوحة الميزانية"),
    el("div",{class:"num-big",style:{color:st.balance>=0?"var(--green)":"var(--red)"}},[fmt(Math.abs(st.balance))," ",el("span",{style:{fontSize:12,color:"#374151",fontWeight:600}},CUR)])
  ]));
  topRow.appendChild(el("div",{style:{display:"flex",gap:8}},[
    el("button",{style:{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,width:38,height:38,fontSize:16,color:"var(--text)"},onclick:function(){go("settings");}},"⚙️"),
  ]));
  hdr.appendChild(topRow);

  // Balance badge
  var isPos=st.balance>=0;
  var bBadge=el("div",{class:"badge",style:{background:isPos?"rgba(255,255,255,.35)":"rgba(220,38,38,.25)",color:isPos?"#111827":"#7f1d1d",marginBottom:16}},
    [isPos?"↑ فائض":"↓ عجز"," ",fmt(Math.abs(st.balance))," ",CUR]);
  hdr.appendChild(bBadge);

  // Month selector
  var ms=el("div",{class:"month-scroll"});
  allM.forEach(function(m){
    var b=el("button",{class:"mtab"+(m===ym?" active":""),onclick:function(){ui.selMonth=m;go("home");}},monthLabel(m));
    ms.appendChild(b);
  });
  hdr.appendChild(ms);
  page.appendChild(hdr);

  var body=el("div",{class:"content"});

  // ── Stat pills
  var sr=el("div",{class:"stat-row"});
  [{label:"الدخل",val:st.income,color:"var(--green)"},{label:"المصروفات",val:st.expense,color:"var(--red)"},{label:"الرصيد",val:st.balance,color:st.balance>=0?"var(--green)":"var(--red)"}].forEach(function(s){
    var p=el("div",{class:"stat-pill"});
    p.appendChild(el("div",{class:"sp-lbl"},s.label));
    p.appendChild(el("div",{class:"sp-val",style:{color:s.color}},fmt(Math.abs(s.val))));
    p.appendChild(el("div",{class:"sp-cur"},CUR));
    sr.appendChild(p);
  });
  body.appendChild(sr);

  // ── Spending rate
  if(st.income>0){
    body.appendChild(ttlEl("نسبة الإنفاق"));
    var sc=el("div",{class:"card card-inner"});
    var pct=Math.min(100,(st.expense/st.income)*100);
    var isHigh=pct>80;
    sc.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}},[
      el("div",{style:{fontSize:14,fontWeight:800,color:"var(--text)"}},Math.round(pct)+"% من الدخل"),

// Excel import — simplified mapping to new data model
var xlHeaders=[],xlRows=[],xlColName="",xlColAmt="",xlColDate="",xlColType="",xlColCat="";
var xlPivotData=null; // holds parsed pivot data {year, incomeRows, expenseRows, monthCols}

// ── Month name detection
var MONTH_NAMES=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec",
  "يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
function isMonthCol(h){var l=String(h||"").toLowerCase().trim();return MONTH_NAMES.some(function(m){return l.startsWith(m)||l===m;});}
function monthIdxFromName(h){var l=String(h||"").toLowerCase().trim();var shorts=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];for(var i=0;i<shorts.length;i++){if(l.startsWith(shorts[i]))return i+1;}var arabic=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];for(var j=0;j<arabic.length;j++){if(l.includes(arabic[j]))return j+1;}return -1;}

function detectPivotSheet(raw){
  // Look for a header row where 2+ columns are month names (scan all rows, not just first 10)
  for(var i=0;i<raw.length;i++){
    var row=raw[i];
    var mCols=row.filter(function(c){return isMonthCol(c);});
    if(mCols.length>=2)return i;
  }
  return -1;
}

function parsePivotSheet(raw,hIdx){
  var hRow=raw[hIdx];
  // Find which columns are months
  var monthCols=[];
  hRow.forEach(function(h,ci){if(isMonthCol(h)){monthCols.push({ci:ci,h:String(h).trim(),mi:monthIdxFromName(h)});}});
  var year=new Date().getFullYear();
  
  // Find the label column (first col that is NOT a month and NOT empty in data rows)
  // Usually col 0 or col 1
  var labelCol=0;
  for(var ci2=0;ci2<hRow.length;ci2++){
    var hv=String(hRow[ci2]||"").trim().toLowerCase();
    if(hv==="item"||hv==="اسم"||hv==="category"||hv==="فئة"){labelCol=ci2;break;}
    // fallback: first non-month, non-empty col
    if(!isMonthCol(hv)&&hv!==""){labelCol=ci2;break;}
  }
  
  // Detect section (INCOME vs EXPENSES) — check ALL columns in row
  var incomeRows=[],expenseRows=[];
  var section="";
  for(var ri=hIdx+1;ri<raw.length;ri++){
    var row=raw[ri];
    // Get first non-empty cell value (section or label)
    var firstVal="";
    for(var ci3=0;ci3<row.length;ci3++){
      var cv=String(row[ci3]||"").trim();
      if(cv){firstVal=cv.toUpperCase();break;}
    }
    if(!firstVal)continue;
    
    // Section detection
    if(firstVal.includes("INCOME")||firstVal.includes("دخل")){section="income";continue;}
    if(firstVal.includes("EXPENSE")||firstVal.includes("مصروف")){section="expense";continue;}
    if(firstVal==="TOTAL"||firstVal==="BALANCE"||firstVal==="SUMMARY"||firstVal==="ANNUAL BUDGET"
       ||firstVal==="AVERAGE"||firstVal==="المجموع"||firstVal==="PERCENTAGE"||firstVal.startsWith("TOTAL"))continue;
    
    if(!section)continue; // skip rows before any section header
    
    // It's a data row — get label from labelCol
    var itemLabel=String(row[labelCol]||"").trim();
    if(!itemLabel||itemLabel.length<2)continue;
    // Skip if label looks like a summary row
    var lup=itemLabel.toUpperCase();
    if(lup==="TOTAL"||lup==="AVERAGE"||lup==="المجموع"||lup==="BALANCE")continue;
    
    monthCols.forEach(function(mc){
      var rawVal=row[mc.ci];
      var val=parseFloat(String(rawVal||"").replace(/,/g,"").replace(/[^0-9.]/g,""))||0;
      if(val<=0)return;
      var dateStr=year+"-"+String(mc.mi).padStart(2,"0")+"-01";
      var tx={label:itemLabel,amount:val,date:dateStr,month:mc.mi,monthName:mc.h};
      if(section==="income")incomeRows.push(tx);
      else if(section==="expense")expenseRows.push(tx);
    });
  }
  // Fallback: if nothing found, try treating ALL non-header rows as expenses
  if(!incomeRows.length&&!expenseRows.length){
    for(var ri2=hIdx+1;ri2<raw.length;ri2++){
      var row2=raw[ri2];
      var lbl2="";
      for(var cx=0;cx<row2.length;cx++){
        var cv2=String(row2[cx]||"").trim();
        if(cv2&&!isMonthCol(cv2)){var lu2=cv2.toUpperCase();if(lu2!=="TOTAL"&&lu2!=="AVERAGE"&&lu2!=="BALANCE"&&lu2!=="SUMMARY"&&lu2!=="ANNUAL BUDGET"&&lu2!=="PERCENTAGE"&&!lu2.startsWith("TOTAL")&&cv2.length>=2){lbl2=cv2;break;}}
      }
      if(!lbl2)continue;
      monthCols.forEach(function(mc2){
        var val2=parseFloat(String(row2[mc2.ci]||"").replace(/,/g,"").replace(/[^0-9.]/g,""))||0;
        if(val2<=0)return;
        expenseRows.push({label:lbl2,amount:val2,date:year+"-"+String(mc2.mi).padStart(2,"0")+"-01",month:mc2.mi,monthName:mc2.h});
      });
    }
  }
  return{year:year,incomeRows:incomeRows,expenseRows:expenseRows,monthCols:monthCols};
}

function handleImportExcel(e){
  var file=e.target.files[0];if(!file)return;
  if(typeof XLSX==="undefined"){showToast("يتطلب اتصال إنترنت");e.target.value="";return;}
  var r=new FileReader();
  r.onload=function(ev){
    try{
      var wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array",cellDates:true});
      // Try all sheets, pick one with most month columns
      var bestSheet=null,bestRaw=null,bestPivotIdx=-1;
      wb.SheetNames.forEach(function(sn){
        var sh=wb.Sheets[sn];
        if(!sh||!sh["!ref"])return;
        var raw=XLSX.utils.sheet_to_json(sh,{header:1,defval:""});
        var pi=detectPivotSheet(raw);
        if(pi>=0&&bestPivotIdx<0){bestSheet=sn;bestRaw=raw;bestPivotIdx=pi;}
      });
      
      if(bestPivotIdx>=0){
        // PIVOT FORMAT — parse directly, show preview & confirm
        var parsed=parsePivotSheet(bestRaw,bestPivotIdx);
        xlPivotData=parsed;
        go("confirmPivot");
        return;
      }
      
      // FALLBACK: list format
      xlPivotData=null;
      var sheet=wb.Sheets[wb.SheetNames[0]];
      if(!sheet||!sheet["!ref"]){showToast("الورقة فارغة");return;}
      var raw=XLSX.utils.sheet_to_json(sheet,{header:1,defval:""});
      var hIdx=raw.findIndex(function(row){return row.filter(function(c){return String(c||"").trim()!=="";}).length>1;});
      if(hIdx<0){showToast("لا توجد بيانات");return;}
      xlHeaders=raw[hIdx].map(function(c){return String(c||"").trim();});
      xlRows=raw.slice(hIdx+1).filter(function(row){return row.some(function(c){return String(c||"").trim()!=="";});});
      if(!xlRows.length){showToast("لا توجد صفوف");return;}
      var auto=function(arr){var h=xlHeaders.map(function(x){return x.toLowerCase();});for(var k=0;k<arr.length;k++){var i=h.findIndex(function(x){return x.includes(arr[k]);});if(i>=0)return String(i);}return "";};
      xlColName=auto(["اسم","وصف","بيان","name","desc","item"]);
      xlColAmt=auto(["مبلغ","قيمة","سعر","amount","price","cost","total"]);
      xlColDate=auto(["تاريخ","date"]);
      xlColType=auto(["نوع","type"]);
      xlColCat=auto(["فئة","تصنيف","category","cat"]);
      go("mapColumns");
    }catch(err){showToast("خطأ: "+err.message);console.error(err);}
  };
  r.readAsArrayBuffer(file);e.target.value="";
}

function parseXlDate(v){if(!v||String(v).trim()==="")return today();if(v instanceof Date)return v.toISOString().slice(0,10);var s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");var n=parseFloat(s);if(!isNaN(n)&&n>40000)return new Date(Math.round((n-25569)*86400*1000)).toISOString().slice(0,10);return today();}

  var pages={
    home:pageHome,
    incomeList:function(){return pageTransList("income");},
    expenseList:function(){return pageTransList("expense");},
    addIncome:function(){ui.editTx=null;return pageAETx("income");},
    addExpense:function(){ui.editTx=null;return pageAETx("expense");},
    editTx:function(){return pageAETx(ui.editTx?ui.editTx.type:"expense");},
    report:pageReport,
    grocery:pageGrocery,
    addGrocery:pageAEGrocery,
    settings:pageSettings,
    mapColumns:pageMapColumns,
