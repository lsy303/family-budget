<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>ميزانية البيت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#F4F4F6;}
body{font-family:'Cairo',sans-serif;max-width:430px;margin:0 auto;color:#1A1A1C;overflow-x:hidden;}
button,input,select{font-family:'Cairo',sans-serif;}
button{cursor:pointer;border:none;background:none;}
::-webkit-scrollbar{width:0;}
input{-webkit-appearance:none;}
.page{min-height:100vh;padding-bottom:100px;}
.hdr{color:#fff;padding:52px 20px 24px;border-radius:0 0 32px 32px;}
.content{padding:20px 16px;display:flex;flex-direction:column;gap:16px;}
.card{background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(0,0,0,.07);overflow:hidden;}
.inp{width:100%;background:#EEEFF2;border:1.5px solid transparent;border-radius:12px;padding:13px 14px;font-size:15px;outline:none;color:#1A1A1C;transition:border-color .2s;display:block;}
.inp:focus{border-color:#4A6FA5;background:#fff;}
.btn{width:100%;border:none;border-radius:13px;padding:14px;font-size:15px;font-weight:800;color:#fff;display:block;text-align:center;}
.btn-ghost{background:#fff!important;border:1.5px solid #E4E4E8;color:#1A1A1C!important;}
.fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;border:none;border-radius:14px;padding:15px;font-size:15px;font-weight:800;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.2);z-index:50;text-align:center;}
.ttl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;color:#6E6E73;}
.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#1A1A1C;color:#fff;border-radius:12px;padding:11px 22px;z-index:300;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;display:none;}
.toast.show{display:block;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;}
.overlay.show{display:flex;}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:28px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{padding:8px 10px;background:#2B2D30;color:#fff;font-weight:700;white-space:nowrap;text-align:right;}
td{padding:7px 10px;white-space:nowrap;border-bottom:1px solid #E4E4E8;text-align:right;}
tr:nth-child(even) td{background:#F4F4F6;}
/* Dark */
body.dark{background:#111214;color:#F0F0F0;}
body.dark .card,.dark .sheet{background:#1C1D20;box-shadow:0 2px 12px rgba(0,0,0,.3);}
body.dark .inp{background:#242528;color:#F0F0F0;}
body.dark .inp:focus{background:#1C1D20;}
body.dark .ttl{color:#8A8A8E;}
body.dark .btn-ghost{background:#1C1D20!important;border-color:#2A2B2E;color:#F0F0F0!important;}
body.dark table th{background:#16181B;}
body.dark table td{border-color:#2A2B2E;}
body.dark tr:nth-child(even) td{background:#242528;}
body.dark select{background:#242528;color:#F0F0F0;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="cdel-overlay">
  <div class="sheet" id="cdel-sheet">
    <div style="font-size:16px;font-weight:800;margin-bottom:6px;" id="cdel-title"></div>
    <div style="font-size:13px;color:#6E6E73;margin-bottom:4px;" id="cdel-name"></div>
    <div style="font-size:12px;color:#C0504A;margin-bottom:16px;display:none;" id="cdel-warn">سيتم حذف كل ما بداخله</div>
    <div style="display:flex;gap:10px;">
      <button class="btn" id="cdel-confirm" style="background:#C0504A;">حذف</button>
      <button class="btn btn-ghost" onclick="closeCdel()">إلغاء</button>
    </div>
  </div>
</div>

<!-- Commitments Apply Sheet -->
<div class="overlay" id="commit-overlay">
  <div class="sheet" id="commit-sheet" style="max-height:85vh;overflow-y:auto;">
    <div style="font-size:18px;font-weight:900;margin-bottom:4px;">📋 الالتزامات الشهرية</div>
    <div style="font-size:13px;color:#6E6E73;margin-bottom:16px;" id="commit-subtitle"></div>
    <div id="commit-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>
    <div style="display:flex;gap:10px;">
      <button class="btn" id="commit-confirm" style="background:#4A6FA5;">✅ تطبيق الكل</button>
      <button class="btn btn-ghost" onclick="closeCommitSheet()">تخطي</button>
    </div>
  </div>
</div>

<script>
const CURRENCY="د.ب";
const COLORS=["#4A6FA5","#C07B5A","#5A8A6A","#8A6A9A","#7A8A5A","#9A5A5A","#5A7A8A","#8A7A4A"];
const EMOJIS=["📁","🏠","🎒","👕","🍽️","💊","🚗","✈️","🎓","💡","🛒","🎁","📚","🧴","🏥","🎮"];
function ld(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
var members=ld("bm",[{id:"husband",label:"الزوج",emoji:"👨",color:"#4A6FA5",budget:0},{id:"wife",label:"الزوجة",emoji:"👩",color:"#C07B5A",budget:0}]);
var folders=ld("bf",[]);
var items=ld("bi",[]);
var dark=ld("bd",false);
var onboarded=ld("bo",false);
var groceries=ld("bgr",[]);
var commitments=ld("bco",[]);
var curView=onboarded?"home":"onboard";
var mid=null,fid=null,editMode=null,cdelCb=null,obStep=0;
var impModal=null,impTarget=null;
var xlHeaders=[],xlRows=[],xlTarget=null,xlName="",xlAmt="",xlDate="",xlFolder="",xlMember="";
var editGrocery=null;
var editCommitment=null;
var activeTab="budget";
function persist(){sv("bm",members);sv("bf",folders);sv("bi",items);sv("bd",dark);sv("bo",onboarded);sv("bgr",groceries);sv("bco",commitments);}
function uid(){return "_"+Date.now()+"_"+Math.random().toString(36).slice(2);}
function fmt(n){return Number(n||0).toFixed(3).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function today(){return new Date().toISOString().slice(0,10);}
function cleanAmt(v){return parseFloat(String(v||0).replace(/,/g,"").replace(/[^0-9.]/g,""))||0;}
function getFStat(id){var it=items.filter(function(i){return i.folderId===id;});return{total:it.reduce(function(s,i){return s+i.amount;},0),items:it};}
function getMStat(id){var mfl=folders.filter(function(f){return f.memberId===id;});var spent=mfl.reduce(function(s,f){return s+getFStat(f.id).total;},0);return{spent:spent,folders:mfl};}
function getAM(){return mid?members.find(function(m){return m.id===mid;}):null;}
function getAF(){return fid?folders.find(function(f){return f.id===fid;}):null;}
var _tt;
function showToast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove("show");},2400);}
function go(v){curView=v;render();}
function openCdel(title,name,warn,cb){document.getElementById("cdel-title").textContent=title;document.getElementById("cdel-name").textContent=name;document.getElementById("cdel-warn").style.display=warn?"block":"none";document.getElementById("cdel-overlay").classList.add("show");cdelCb=cb;}
function closeCdel(){document.getElementById("cdel-overlay").classList.remove("show");cdelCb=null;}
document.getElementById("cdel-confirm").onclick=function(){if(cdelCb){cdelCb();closeCdel();}};
document.getElementById("cdel-overlay").onclick=function(e){if(e.target.id==="cdel-overlay")closeCdel();};

/* ---------- COMMITMENTS SHEET ---------- */
function thisMonth(){return new Date().toISOString().slice(0,7);}
function getCommitmentsNotApplied(){
  var m=thisMonth();
  return commitments.filter(function(c){return !c.appliedMonths||c.appliedMonths.indexOf(m)<0;});
}
function openCommitSheet(){
  var pending=getCommitmentsNotApplied();
  if(!pending.length)return;
  var sub=document.getElementById("commit-subtitle");
  sub.textContent=pending.length+" التزام بإجمالي "+fmt(pending.reduce(function(s,c){return s+c.amount;},0))+" "+CURRENCY;
  var list=document.getElementById("commit-list");
  list.innerHTML="";
  pending.forEach(function(c){
    var f=folders.find(function(fl){return fl.id===c.folderId;})||{};
    var m2=members.find(function(mb){return mb.id===c.memberId;})||{};
    var row=el("div",{style:{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:dark?"#242528":"#F4F4F6",borderRadius:12,borderRight:"3px solid "+(f.color||"#4A6FA5")}});
    row.appendChild(el("div",{style:{fontSize:20}},c.emoji||"💳"));
    var info=el("div",{style:{flex:1}});
    info.appendChild(el("div",{style:{fontSize:14,fontWeight:800,color:dark?"#F0F0F0":"#1A1A1C"}},c.name));
    info.appendChild(el("div",{style:{fontSize:11,color:dark?"#8A8A8E":"#6E6E73",marginTop:2}},(m2.emoji||"")+" "+(m2.label||"")+" ← "+(f.name||"غير محدد")));
    row.appendChild(info);
    row.appendChild(el("div",{style:{fontSize:15,fontWeight:900,color:f.color||"#4A6FA5"}},fmt(c.amount)+" "+CURRENCY));
    list.appendChild(row);
  });
  document.getElementById("commit-overlay").classList.add("show");
}
function closeCommitSheet(){document.getElementById("commit-overlay").classList.remove("show");}
document.getElementById("commit-confirm").onclick=function(){
  var m=thisMonth();
  var pending=getCommitmentsNotApplied();
  var ts=Date.now();
  pending.forEach(function(c,i){
    if(!c.folderId)return;
    var f=folders.find(function(fl){return fl.id===c.folderId;});
    if(!f)return;
    items.push({id:"ci_"+ts+"_"+i,folderId:c.folderId,memberId:c.memberId,name:c.name,amount:c.amount,date:today(),isCommitment:true});
    commitments=commitments.map(function(x){
      if(x.id!==c.id)return x;
      var am=x.appliedMonths?x.appliedMonths.slice():[];
      am.push(m);
      return Object.assign({},x,{appliedMonths:am});
    });
  });
  persist();
  closeCommitSheet();
  showToast("تم تطبيق "+pending.length+" التزام ✅");
  render();
};
document.getElementById("commit-overlay").onclick=function(e){if(e.target.id==="commit-overlay")closeCommitSheet();};
function applyTheme(){document.body.classList.toggle("dark",dark);}
function el(tag,attrs,kids){
  var e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(function(kv){
    var k=kv[0],v=kv[1];
    if(k==="class")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on")&&typeof v==="function")e.addEventListener(k.slice(2),v);
    else e[k]=v;
  });
  if(kids!=null){var arr=Array.isArray(kids)?kids:[kids];arr.forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(String(c)):c);});}
  return e;
}
function div(cls,style,kids){return el("div",{class:cls,style:style},kids);}
function hdr(color,kids){
  var isLight=color==="#fff"||color==="white";
  return el("div",{class:"hdr",style:{background:color,borderBottom:isLight?"2px solid #4A6FA5":"none",color:isLight?"#1A1A1C":"#fff"}},kids);
}
function backBtn(to,light){
  var b=el("button",{style:{background:light?"rgba(255,255,255,.15)":(dark?"#242528":"#EEEFF2"),border:"none",borderRadius:10,width:38,height:38,fontSize:17,color:light?"#fff":(dark?"#F0F0F0":"#1A1A1C"),flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"},onclick:function(){go(to);}});
  b.textContent="→";return b;
}
function barEl(spent,budget,color,light){
  if(!budget)return null;
  var pct=Math.min(100,(spent/budget)*100),over=spent>budget;
  var wrap=el("div",null);
  var bw=el("div",{style:{background:light?"rgba(255,255,255,.2)":(dark?"#2A2B2E":"#E4E4E8"),borderRadius:99,height:5,overflow:"hidden",marginTop:10}});
  bw.appendChild(el("div",{style:{height:"100%",width:pct+"%",background:over?"#C0504A":light?"rgba(255,255,255,.85)":color,borderRadius:99,transition:"width .4s"}}));
  wrap.appendChild(bw);
  var lbl=el("div",{style:{display:"flex",justifyContent:"space-between",marginTop:5,fontSize:11,fontWeight:600,color:light?"rgba(255,255,255,.7)":(dark?"#8A8A8E":"#6E6E73")}});
  lbl.appendChild(el("span",null,Math.round(pct)+"%"));
  lbl.appendChild(el("span",{style:{color:over?"#C0504A":light?"rgba(255,255,255,.9)":(dark?"#3A9A5A":"#2E8A50")}},over?"تجاوز "+fmt(spent-budget):"متبقي "+fmt(budget-spent)+" "+CURRENCY));
  wrap.appendChild(lbl);
  return wrap;
}
function mBtn(text,color,onclick,ghost){
  return el("button",{class:"btn"+(ghost?" btn-ghost":""),onclick:onclick,style:{background:ghost?"":color}},text);
}
function ttlEl(text,style){var d=el("div",{class:"ttl"});d.textContent=text;if(style)Object.assign(d.style,style);return d;}
function inpEl(attrs){
  var extra=attrs.style||{};delete attrs.style;
  var i=el("input",Object.assign({class:"inp"},attrs));
  Object.assign(i.style,extra);
  if(dark){i.style.background="#242528";i.style.color="#F0F0F0";}
  i.addEventListener("focus",function(){i.style.borderColor="#4A6FA5";i.style.background=dark?"#1C1D20":"#fff";});
  i.addEventListener("blur",function(){i.style.borderColor="transparent";i.style.background=dark?"#242528":"#EEEFF2";});
  return i;
}
function colorPicker(cur,onChange){
  var wrap=el("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}});
  COLORS.forEach(function(c){
    var b=el("button",{style:{width:38,height:38,borderRadius:10,background:c,border:cur===c?"3px solid "+(dark?"#F0F0F0":"#1A1A1C"):"3px solid transparent",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14},onclick:function(){onChange(c);}});
    if(cur===c)b.textContent="✓";
    wrap.appendChild(b);
  });
  return wrap;
}
function emojiPicker(cur,sc,onChange){
  var wrap=el("div",{style:{display:"flex",flexWrap:"wrap",gap:7}});
  EMOJIS.forEach(function(em){
    var b=el("button",{style:{width:42,height:42,fontSize:19,borderRadius:10,border:"2px solid",borderColor:cur===em?sc:(dark?"#2A2B2E":"#E4E4E8"),background:cur===em?sc+"20":(dark?"#242528":"#EEEFF2")},onclick:function(){onChange(em);}});
    b.textContent=em;wrap.appendChild(b);
  });
  return wrap;
}
function memberSel(curId,onSel){
  var wrap=el("div",{style:{display:"flex",flexDirection:"column",gap:8}});
  members.forEach(function(m){
    var isSel=curId===m.id;
    var b=el("button",{style:{display:"flex",alignItems:"center",gap:12,padding:"12px 16px",borderRadius:14,border:"2px solid",borderColor:isSel?m.color:(dark?"#2A2B2E":"#E4E4E8"),background:isSel?m.color+"12":(dark?"#1C1D20":"#fff"),cursor:"pointer",width:"100%",textAlign:"right"},onclick:function(){onSel(m.id);wrap.querySelectorAll("button").forEach(function(x){x.style.borderColor=dark?"#2A2B2E":"#E4E4E8";x.style.background=dark?"#1C1D20":"#fff";});b.style.borderColor=m.color;b.style.background=m.color+"12";}});
    b.appendChild(el("div",{style:{width:36,height:36,borderRadius:11,background:m.color+"20",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}},m.emoji));
    b.appendChild(el("div",{style:{flex:1,fontSize:14,fontWeight:800,color:dark?"#F0F0F0":"#1A1A1C"}},m.label));
    if(isSel)b.appendChild(el("span",{style:{fontSize:16,color:m.color}},"✓"));
    wrap.appendChild(b);
  });
  return wrap;
}
function selEl(opts,curVal,color,onChange){
  var s=el("select",{style:{width:"100%",background:dark?"#242528":"#EEEFF2",border:"1.5px solid "+(curVal?color:(dark?"#2A2B2E":"#E4E4E8")),borderRadius:10,padding:"9px 12px",fontSize:13,color:dark?"#F0F0F0":"#1A1A1C",outline:"none"}});
  var o0=document.createElement("option");o0.value="";o0.textContent="— لا يوجد —";s.appendChild(o0);
  opts.forEach(function(op,i){var o=document.createElement("option");o.value=String(i);o.textContent=op;s.appendChild(o);});
  s.value=curVal||"";s.addEventListener("change",function(e){onChange(e.target.value);});
  return s;
}

/* ---------- EXPORT / IMPORT ---------- */
function exportMember(mbId){var mb=members.find(function(x){return x.id===mbId;}),mfl=folders.filter(function(f){return f.memberId===mbId;}),fids=mfl.map(function(f){return f.id;}),mi=items.filter(function(i){return fids.includes(i.folderId);});var p={_type:"budget-export",version:1,fromLabel:mb.label,fromEmoji:mb.emoji,exportDate:today(),folders:mfl.map(function(f){return{_origId:f.id,name:f.name,emoji:f.emoji,color:f.color,budget:f.budget};}),items:mi.map(function(i){return{name:i.name,amount:i.amount,date:i.date,_origFolderId:i.folderId};})};dlFile(JSON.stringify(p,null,2),"مصروفات-"+mb.label+"-"+today()+".json");}
function exportAll(){dlFile(JSON.stringify({_type:"budget-export-all",version:1,exportDate:today(),members:members,folders:folders,items:items},null,2),"ميزانية-البيت-"+today()+".json");}
function dlFile(data,name){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();showToast("تم التصدير");}
function handleImportJSON(e){var file=e.target.files[0];if(!file)return;var r=new FileReader();r.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(data._type==="budget-export-all"){if(confirm("سيستبدل كل البيانات. متأكد؟")){members=data.members;folders=data.folders;items=data.items;persist();showToast("تم الاستيراد");render();}}else if(data._type==="budget-export"){impModal=data;impTarget=members[0]?members[0].id:null;go("importJSON");}else showToast("الملف غير صحيح");}catch(err){showToast("خطأ في الملف");}};r.readAsText(file);e.target.value="";}
function confirmImpJSON(){if(!impTarget||!impModal)return;var ts=Date.now(),fmap={};var nf=impModal.folders.map(function(f,i){var nid="f_imp_"+ts+"_"+i;fmap[f._origId]=nid;return{id:nid,memberId:impTarget,name:f.name,emoji:f.emoji,color:f.color,budget:f.budget||0};});var ni=impModal.items.map(function(it,i){return{id:"i_imp_"+ts+"_"+i,folderId:fmap[it._origFolderId],memberId:impTarget,name:it.name,amount:it.amount,date:it.date};});folders=folders.concat(nf);items=items.concat(ni);impModal=null;persist();showToast("تم الاستيراد");go("home");}

function parseXlDate(v){if(!v||String(v).trim()==="")return today();if(v instanceof Date)return v.toISOString().slice(0,10);var s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");var n=parseFloat(s);if(!isNaN(n)&&n>40000)return new Date(Math.round((n-25569)*86400*1000)).toISOString().slice(0,10);return today();}

        el("div",{style:{fontSize:10,color:applied?"#2E8A50":"#C07B5A",fontWeight:700}},applied?"✓ طُبّق":"لم يُطبَّق")
      ]));
      var cc=Object.assign({},c);
      right.appendChild(el("button",{style:{background:"#4A6FA520",border:"none",borderRadius:8,width:30,height:30,fontSize:13},onclick:function(){editCommitment=cc;go("addCommitment");}},"✏️"));
      row.appendChild(right);
      card.appendChild(row);
    });
    var totRow=el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 18px",background:dark?"#242528":"#EEEFF2",borderTop:"2px solid "+(dark?"#2A2B2E":"#E4E4E8")}});
    totRow.appendChild(el("span",{style:{fontSize:13,fontWeight:800,color:dark?"#8A8A8E":"#6E6E73"}},"الإجمالي الشهري"));
    totRow.appendChild(el("span",{style:{fontSize:16,fontWeight:900,color:"#4A6FA5"}},fmt(commitments.reduce(function(s,c){return s+c.amount;},0))+" "+CURRENCY));
    card.appendChild(totRow);
    body.appendChild(card);
    var nc=getCommitmentsNotApplied();
    if(nc.length){
      body.appendChild(el("button",{class:"btn",style:{background:"#4A6FA5",marginBottom:10},onclick:function(){openCommitSheet();}},"📋 تطبيق "+nc.length+" التزام هذا الشهر"));
    } else {
      body.appendChild(el("div",{style:{background:"#2E8A5018",border:"1.5px solid #2E8A5040",borderRadius:12,padding:"12px 16px",textAlign:"center",fontSize:13,fontWeight:700,color:"#2E8A50",marginBottom:10}},"✅ تم تطبيق كل الالتزامات هذا الشهر"));
    }
  }
  page.appendChild(body);
  page.appendChild(el("button",{class:"fab",style:{background:"#4A6FA5"},onclick:function(){editCommitment=null;go("addCommitment");}},"＋ التزام جديد"));
  return page;
}

/* ---------- ADD/EDIT COMMITMENT ---------- */
function pageAECommitment(){
  var isEdit=!!editCommitment;
  var f=isEdit?editCommitment:{name:"",amount:"",emoji:"💳",folderId:"",memberId:members[0]?members[0].id:""};
  var curEmoji=f.emoji||"💳";
  var curFid=f.folderId||"";
  var curMid=f.memberId||"";
  var CEMOJIS=["💳","🏠","🚗","💊","📱","🎓","💡","🌊","🏦","🛡️","📺","🎵"];
  var page=el("div",{style:{minHeight:"100vh",paddingBottom:80,background:dark?"#111214":"#F4F4F6"}});
  page.appendChild(hdr("#4A6FA5",el("div",{style:{display:"flex",alignItems:"center",gap:12}},[
    backBtn("commitments",true),
    el("div",{style:{fontSize:20,fontWeight:900}},isEdit?"تعديل الالتزام":"التزام جديد")
  ])));
  var body=el("div",{class:"content"});
  /* emoji */
  body.appendChild(ttlEl("الأيقونة"));
  var epick=el("div",{style:{display:"flex",flexWrap:"wrap",gap:8}});
  CEMOJIS.forEach(function(em){
    var b=el("button",{style:{width:42,height:42,fontSize:20,borderRadius:10,border:"2px solid",borderColor:curEmoji===em?"#4A6FA5":(dark?"#2A2B2E":"#E4E4E8"),background:curEmoji===em?"#4A6FA520":(dark?"#242528":"#EEEFF2")},onclick:function(){curEmoji=em;epick.querySelectorAll("button").forEach(function(x){x.style.borderColor=dark?"#2A2B2E":"#E4E4E8";x.style.background=dark?"#242528":"#EEEFF2";});b.style.borderColor="#4A6FA5";b.style.background="#4A6FA520";}});
    b.textContent=em;epick.appendChild(b);
  });
  body.appendChild(epick);
  /* name */
  body.appendChild(ttlEl("اسم الالتزام"));
  var ni=inpEl({value:f.name,placeholder:"مثال: إيجار البيت، قسط السيارة"});
  body.appendChild(ni);
  /* amount */
  body.appendChild(ttlEl("المبلغ الشهري ("+CURRENCY+")"));
  var aw=el("div",{style:{position:"relative"}});
  var ai=inpEl({type:"number",step:"0.001",value:f.amount||"",placeholder:"0.000",style:{fontSize:22,fontWeight:900,paddingLeft:52}});
  aw.appendChild(ai);
  aw.appendChild(el("span",{style:{position:"absolute",left:15,top:"50%",transform:"translateY(-50%)",fontSize:12,color:dark?"#8A8A8E":"#6E6E73",fontWeight:700,pointerEvents:"none"}},CURRENCY));
  body.appendChild(aw);
  /* member */
  body.appendChild(ttlEl("الفرد"));
  var msel=memberSel(curMid,function(id){curMid=id;});
  body.appendChild(msel);
  /* folder */
  body.appendChild(ttlEl("المجلد الوجهة (اختياري)"));
  var mFolders=folders.filter(function(fl){return !curMid||fl.memberId===curMid;});
  var fsel=el("select",{style:{width:"100%",background:dark?"#242528":"#EEEFF2",border:"1.5px solid "+(curFid?"#4A6FA5":(dark?"#2A2B2E":"#E4E4E8")),borderRadius:12,padding:"13px 14px",fontSize:14,color:dark?"#F0F0F0":"#1A1A1C",outline:"none"}});
  var fo=document.createElement("option");fo.value="";fo.textContent="— بدون مجلد —";fsel.appendChild(fo);
  folders.forEach(function(fl){var m2=members.find(function(x){return x.id===fl.memberId;})||{};var o=document.createElement("option");o.value=fl.id;o.textContent=(m2.emoji||"")+" "+fl.name;if(fl.id===curFid)o.selected=true;fsel.appendChild(o);});
  fsel.addEventListener("change",function(e){curFid=e.target.value;});
  body.appendChild(fsel);
  /* save */
  var saveFn=function(){
    var name=ni.value.trim();if(!name){showToast("أدخل اسم الالتزام");return;}
    var amount=parseFloat(ai.value);if(!amount||amount<=0){showToast("أدخل مبلغًا صحيحًا");return;}
    var obj={id:isEdit?f.id:uid(),name:name,amount:amount,emoji:curEmoji,folderId:curFid,memberId:curMid,appliedMonths:isEdit?(f.appliedMonths||[]):[]};
    if(isEdit){commitments=commitments.map(function(c){return c.id===f.id?obj:c;});}
    else{commitments.push(obj);}
    persist();showToast(isEdit?"تم الحفظ":"تمت الإضافة");go("commitments");
  };
  var btnRow=el("div",{style:{display:"flex",gap:10,marginTop:4}});
  btnRow.appendChild(el("button",{class:"btn",style:{background:"#4A6FA5"},onclick:saveFn},isEdit?"💾 حفظ":"✅ إضافة"));
  if(isEdit){
    var cf=Object.assign({},f);
    btnRow.appendChild(el("button",{style:{background:"#C0504A18",border:"none",borderRadius:13,padding:"14px 18px",fontSize:15,cursor:"pointer",color:"#C0504A",fontWeight:800},onclick:function(){openCdel("حذف الالتزام؟",cf.name,false,function(){commitments=commitments.filter(function(c){return c.id!==cf.id;});persist();showToast("تم الحذف");go("commitments");});}},"🗑️"));
  }
  body.appendChild(btnRow);
  page.appendChild(body);return page;
}

/* ---------- RENDER ---------- */
function render(){
  applyTheme();
  var root=document.getElementById("root");
  root.innerHTML="";
  if(!onboarded){root.appendChild(pageOnboard());return;}
  var pages={
    home:pageHome, settings:pageSettings,
    memberView:pageMemberView, folderView:pageFolderView,
    addMember:function(){return pageAEMember(false);}, editMember:function(){return pageAEMember(true);},
    addFolder:function(){return pageAEFolder(false);}, editFolder:function(){return pageAEFolder(true);},
    addItem:function(){return pageAEItem(false);}, editItem:function(){return pageAEItem(true);},
    importJSON:pageImportJSON, mapColumns:pageMapColumns,
    report:pageReport, grocery:pageGrocery, addGrocery:pageAEGrocery,
    commitments:pageCommitments, addCommitment:pageAECommitment,
  };
  var fn=pages[curView];
  if(fn)root.appendChild(fn());
}
render();
</script>
